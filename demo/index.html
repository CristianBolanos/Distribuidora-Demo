/**
 * Historial.gs — Auditoría de operaciones (pedidos, rutas, usuarios, productos y configuración).
 * Las entradas se escriben por lotes y nunca se modifican desde la aplicación.
 */

function auditValue_(v, max) {
  if (v === null || v === undefined) return '';
  const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
  return s.length > (max || 2000) ? s.slice(0, (max || 2000) - 1) + '…' : s;
}

/** entries: [{entidad, entidad_id, accion, anterior, nuevo, observacion, fecha?}] */
function logHistory_(entries, user) {
  if (!entries || !entries.length) return;
  const now = now_();
  appendRows_('Historial', entries.map(function (e) {
    return {
      historial_id: uuid_(),
      entidad: e.entidad,
      entidad_id: e.entidad_id,
      accion: e.accion,
      valor_anterior: auditValue_(e.anterior),
      valor_nuevo: auditValue_(e.nuevo),
      fecha_evento: e.fecha || now,
      usuario: e.usuario || (user && user.correo) || 'sistema',
      observacion: auditValue_(e.observacion, 1000)
    };
  }));
}

function historyFor_(entidad, id) {
  return readTable_('Historial')
    .filter(function (h) { return h.entidad === entidad && h.entidad_id === id; })
    .map(clean_)
    .sort(function (a, b) { return a.fecha_evento < b.fecha_evento ? -1 : a.fecha_evento > b.fecha_evento ? 1 : 0; });
}

function listHistorial_(p) {
  const desde = vDate_(p.desde, 'Desde', false);
  const hasta = vDate_(p.hasta, 'Hasta', false);
  const entidad = vStr_(p.entidad, 'Entidad', { max: 40 });
  const q = vStr_(p.q, 'Búsqueda', { max: 100 }).toLowerCase();
  const pageSize = Math.min(CONFIG.MAX_PAGE_SIZE, Math.max(5, Number(p.pageSize) || 25));
  const page = Math.max(1, Math.floor(Number(p.page) || 1));
  const pedidos = indexBy_(readTable_('Pedidos'), 'pedido_id');

  let rows = readTable_('Historial').filter(function (h) {
    const d = h.fecha_evento.slice(0, 10);
    if (desde && d < desde) return false;
    if (hasta && d > hasta) return false;
    if (entidad && h.entidad !== entidad) return false;
    if (q) {
      const ref = h.entidad === 'Pedido' && pedidos[h.entidad_id] ? pedidos[h.entidad_id].numero_pedido : h.entidad_id;
      const hay = [ref, h.accion, h.usuario, h.observacion].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  rows.sort(function (a, b) { return a.fecha_evento > b.fecha_evento ? -1 : a.fecha_evento < b.fecha_evento ? 1 : 0; });
  const total = rows.length;
  rows = rows.slice((page - 1) * pageSize, page * pageSize).map(function (h) {
    const o = clean_(h);
    o.referencia = h.entidad === 'Pedido' && pedidos[h.entidad_id] ? pedidos[h.entidad_id].numero_pedido : h.entidad_id;
    return o;
  });
  return { items: rows, total: total, page: page, pageSize: pageSize, pages: Math.max(1, Math.ceil(total / pageSize)) };
}

// ===== src/Productos.gs =====
/**
 * Productos.gs — Catálogo de productos. No se implementa inventario (existencias/movimientos):
 * el catálogo solo identifica lo que se pide y se prepara.
 */

function listProductos_(p, u) {
  const soloActivos = !can_(u, 'productos.gestionar') || vBool_(p.soloActivos);
  return readTable_('Productos')
    .filter(function (x) { return !soloActivos || x.activo === 'SI'; })
    .map(clean_)
    .sort(function (a, b) { return a.nombre.localeCompare(b.nombre); });
}

function saveProducto_(p, u) {
  const productos = readTable_('Productos');
  const id = vId_(p.producto_id, 'Producto', false);
  const data = {
    sku: vStr_(p.sku, 'SKU', { required: true, max: 40 }).toUpperCase(),
    nombre: vStr_(p.nombre, 'Nombre', { required: true, max: 150 }),
    descripcion: vStr_(p.descripcion, 'Descripción', { max: 500 }),
    unidad_medida: vStr_(p.unidad_medida, 'Unidad de medida', { required: true, max: 20 }),
    precio_referencia: vNumber_(p.precio_referencia, 'Precio de referencia', { min: 0, max: 1e10 }),
    activo: vBool_(p.activo) ? 'SI' : 'NO'
  };
  if (!/^[A-Z0-9._-]+$/.test(data.sku)) throw appError_('VALIDACION', 'El SKU solo admite letras, números, punto, guion y guion bajo.');
  const dup = productos.filter(function (x) { return x.sku.toUpperCase() === data.sku && x.producto_id !== id; })[0];
  if (dup) throw appError_('VALIDACION', 'Ya existe un producto con el SKU ' + data.sku + '.');
  const now = now_();
  if (!id) {
    const nuevo = Object.assign({ producto_id: uuid_(), fecha_creacion: now, fecha_actualizacion: now, es_demo: 'NO' }, data);
    appendRows_('Productos', [nuevo]);
    logHistory_([{ entidad: 'Producto', entidad_id: nuevo.producto_id, accion: 'CREAR', nuevo: data }], u);
    return clean_(nuevo);
  }
  const actual = productos.filter(function (x) { return x.producto_id === id; })[0];
  if (!actual) throw appError_('NO_ENCONTRADO', 'No se encontró el producto.');
  const anterior = clean_(actual);
  Object.assign(actual, data, { fecha_actualizacion: now });
  updateRow_('Productos', actual);
  logHistory_([{ entidad: 'Producto', entidad_id: id, accion: 'EDITAR', anterior: anterior, nuevo: data }], u);
  return clean_(actual);
}

// ===== src/Pedidos.gs =====
/**
 * Pedidos.gs — Registro, consulta, edición, duplicación, anulación y eliminación de pedidos.
 */

const PEDIDO_CAMPOS_BASE = ['cliente_nombre', 'cliente_documento', 'cliente_telefono', 'cliente_correo',
  'direccion_entrega', 'ciudad', 'zona', 'fecha_estimada_entrega', 'prioridad', 'observaciones',
  'observaciones_internas', 'responsable_id'];

/* ===================== Contexto y resumen ===================== */

function refCtx_() {
  const agg = {};
  readTable_('DetallePedidos').forEach(function (d) {
    const a = agg[d.pedido_id] || (agg[d.pedido_id] = { referencias: 0, unidades: 0, total: 0, hayPrecio: false });
    a.referencias++;
    a.unidades += Number(d.cantidad) || 0;
    if (d.subtotal !== '') { a.total += Number(d.subtotal) || 0; a.hayPrecio = true; }
  });
  return {
    agg: agg,
    rutas: indexBy_(readTable_('Rutas'), 'ruta_id'),
    usuarios: indexBy_(readTable_('Usuarios'), 'usuario_id')
  };
}

function rutaLabel_(r) { return r ? r.codigo_ruta + ' · ' + r.nombre_ruta : ''; }

function summarizePedido_(p, ctx, today) {
  const a = ctx.agg[p.pedido_id] || { referencias: 0, unidades: 0, total: 0, hayPrecio: false };
  const r = ctx.rutas[p.ruta_id];
  const resp = ctx.usuarios[p.responsable_id];
  return {
    pedido_id: p.pedido_id,
    numero_pedido: p.numero_pedido,
    fecha_creacion: p.fecha_creacion,
    cliente_nombre: p.cliente_nombre,
    direccion_entrega: p.direccion_entrega,
    ciudad: p.ciudad,
    zona: p.zona,
    referencias: a.referencias,
    unidades: Math.round(a.unidades * 100) / 100,
    total: a.hayPrecio ? Math.round(a.total * 100) / 100 : null,
    estado: p.estado,
    prioridad: p.prioridad,
    ruta_id: p.ruta_id,
    ruta_nombre: rutaLabel_(r),
    ruta_estado: r ? r.estado : '',
    responsable_id: p.responsable_id,
    responsable_nombre: resp ? resp.nombre : '',
    fecha_estimada_entrega: p.fecha_estimada_entrega,
    fecha_despacho: p.fecha_despacho,
    fecha_entrega: p.fecha_entrega,
    fecha_actualizacion: p.fecha_actualizacion,
    fecha_inicio_preparacion: p.fecha_inicio_preparacion,
    observaciones: p.observaciones,
    anulado: p.anulado === 'SI',
    retrasado: isRetrasado_(p, today),
    preparado: !!p.fecha_fin_preparacion,
    version: p.version,
    es_demo: p.es_demo === 'SI'
  };
}

/* ===================== Listado ===================== */

const PEDIDO_SORT = ['numero_pedido', 'fecha_creacion', 'cliente_nombre', 'zona', 'unidades', 'estado', 'prioridad',
  'ruta_nombre', 'responsable_nombre', 'fecha_estimada_entrega', 'fecha_actualizacion'];

function listPedidos_(f) {
  const q = vStr_(f.q, 'Búsqueda', { max: 100 }).toLowerCase();
  const estado = vEnum_(f.estado, ESTADOS, 'Estado', false);
  const desde = vDate_(f.desde, 'Desde', false);
  const hasta = vDate_(f.hasta, 'Hasta', false);
  const rutaId = vId_(f.ruta_id, 'Ruta', false);
  const respId = vId_(f.responsable_id, 'Responsable', false);
  const prioridad = vEnum_(f.prioridad, PRIORIDADES, 'Prioridad', false);
  const retrasados = vBool_(f.retrasados);
  const incluirAnulados = vBool_(f.incluirAnulados);
  const preparado = vEnum_(f.preparado, ['SI', 'NO'], 'Preparado', false);
  if (desde && hasta && desde > hasta) throw appError_('VALIDACION', 'La fecha inicial no puede ser posterior a la final.');
  const sortBy = PEDIDO_SORT.indexOf(f.sortBy) >= 0 ? f.sortBy : 'fecha_creacion';
  const dir = f.sortDir === 'asc' ? 1 : -1;
  const pageSize = Math.min(CONFIG.MAX_PAGE_SIZE, Math.max(5, Math.floor(Number(f.pageSize) || 20)));
  let page = Math.max(1, Math.floor(Number(f.page) || 1));

  const today = today_();
  const ctx = refCtx_();
  let items = readTable_('Pedidos').filter(function (p) {
    if (!incluirAnulados && p.anulado === 'SI') return false;
    if (q && p.numero_pedido.toLowerCase().indexOf(q) < 0 && p.cliente_nombre.toLowerCase().indexOf(q) < 0 &&
        p.cliente_documento.toLowerCase().indexOf(q) < 0) return false;
    if (estado && p.estado !== estado) return false;
    const fc = p.fecha_creacion.slice(0, 10);
    if (desde && fc < desde) return false;
    if (hasta && fc > hasta) return false;
    if (rutaId && (rutaId === '__none' ? p.ruta_id !== '' : p.ruta_id !== rutaId)) return false;
    if (respId && (respId === '__none' ? p.responsable_id !== '' : p.responsable_id !== respId)) return false;
    if (prioridad && p.prioridad !== prioridad) return false;
    if (retrasados && !isRetrasado_(p, today)) return false;
    if (preparado && (!!p.fecha_fin_preparacion) !== (preparado === 'SI')) return false;
    return true;
  }).map(function (p) { return summarizePedido_(p, ctx, today); });

  items.sort(function (a, b) {
    let x = a[sortBy], y = b[sortBy];
    if (sortBy === 'prioridad') { x = PRIORIDAD_RANK[x] || 0; y = PRIORIDAD_RANK[y] || 0; }
    if (sortBy === 'estado') { x = ESTADOS.indexOf(x); y = ESTADOS.indexOf(y); }
    if (x < y) return -dir;
    if (x > y) return dir;
    return a.numero_pedido < b.numero_pedido ? dir : -dir;
  });
  const total = items.length;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  page = Math.min(page, pages);
  return { items: items.slice((page - 1) * pageSize, page * pageSize), total: total, page: page, pageSize: pageSize, pages: pages };
}

/* ===================== Detalle ===================== */

function findPedido_(id) {
  const pid = vId_(id, 'Pedido', true);
  const ped = readTable_('Pedidos').filter(function (x) { return x.pedido_id === pid; })[0];
  if (!ped) throw appError_('NO_ENCONTRADO', 'No se encontró el pedido solicitado.');
  return ped;
}

/** Carga un pedido para escritura verificando la versión enviada por el cliente. */
function loadPedido_(id, version) {
  const ped = findPedido_(id);
  if (version !== undefined && version !== null && version !== '' && String(ped.version) !== String(version)) {
    throw appError_('CONFLICTO', 'El pedido fue modificado por otro usuario o proceso. Recargue la información e intente de nuevo.');
  }
  return ped;
}

function savePedido_(ped, u) {
  ped.version = String((Number(ped.version) || 0) + 1);
  ped.fecha_actualizacion = now_();
  ped.actualizado_por = u.correo;
  updateRow_('Pedidos', ped);
}

function getPedido_(p, u) {
  const ped = findPedido_(p.pedido_id);
  const ctx = refCtx_();
  const detalles = readTable_('DetallePedidos').filter(function (d) { return d.pedido_id === ped.pedido_id; }).map(clean_);
  const usuario = function (id) { const x = ctx.usuarios[id]; return x ? { usuario_id: x.usuario_id, nombre: x.nombre } : null; };
  return {
    pedido: clean_(ped),
    resumen: summarizePedido_(ped, ctx, today_()),
    detalles: detalles,
    historial: historyFor_('Pedido', ped.pedido_id),
    ruta: ctx.rutas[ped.ruta_id] ? clean_(ctx.rutas[ped.ruta_id]) : null,
    responsable: usuario(ped.responsable_id),
    preparador: usuario(ped.preparador_id),
    editables: editableFields_(u, ped),
    lineasEditables: lineasEditables_(u, ped)
  };
}

/* ===================== Validación de entrada ===================== */

function validatePedidoInput_(d, usuarios) {
  const out = {
    cliente_nombre: vStr_(d.cliente_nombre, 'Cliente', { required: true, max: 150 }),
    cliente_documento: vStr_(d.cliente_documento, 'Documento', { max: 30 }),
    cliente_telefono: vPhone_(d.cliente_telefono, 'Teléfono', true),
    cliente_correo: vEmail_(d.cliente_correo, 'Correo electrónico', false),
    direccion_entrega: vStr_(d.direccion_entrega, 'Dirección de entrega', { required: true, max: 250 }),
    ciudad: vStr_(d.ciudad, 'Ciudad o municipio', { required: true, max: 80 }),
    zona: vStr_(d.zona, 'Barrio o zona', { required: true, max: 80 }),
    fecha_estimada_entrega: vDate_(d.fecha_estimada_entrega, 'Fecha estimada de entrega', true),
    prioridad: vEnum_(d.prioridad || 'normal', PRIORIDADES, 'Prioridad'),
    observaciones: vStr_(d.observaciones, 'Observaciones', { max: 1000 }),
    observaciones_internas: vStr_(d.observaciones_internas, 'Observaciones internas', { max: 1000 }),
    responsable_id: vId_(d.responsable_id, 'Responsable', false)
  };
  if (out.responsable_id) {
    const r = usuarios[out.responsable_id];
    if (!r || r.activo !== 'SI') throw appError_('VALIDACION', 'El responsable seleccionado no existe o está inactivo.');
  }
  return out;
}

function productosMap_() { return indexBy_(readTable_('Productos'), 'producto_id'); }

/** Verifica que una ruta admita nuevos pedidos (estado y capacidad). */
function assertRutaAsignable_(rutaId, nuevos) {
  const r = readTable_('Rutas').filter(function (x) { return x.ruta_id === rutaId; })[0];
  if (!r) throw appError_('NO_ENCONTRADO', 'No se encontró la ruta seleccionada.');
  if (r.estado !== 'planificada' && r.estado !== 'activa') {
    throw appError_('ESTADO_INVALIDO', 'No se pueden asignar pedidos a una ruta ' + r.estado + '.');
  }
  const cap = Number(r.capacidad) || 0;
  if (cap > 0 && nuevos > 0) {
    const actuales = readTable_('Pedidos').filter(function (p) {
      return p.ruta_id === rutaId && p.anulado !== 'SI' && p.estado !== 'Entregado';
    }).length;
    if (actuales + nuevos > cap) {
      throw appError_('VALIDACION', 'La ruta ' + r.codigo_ruta + ' superaría su capacidad (' + cap + ' pedidos; asignados: ' + actuales + ').');
    }
  }
  return r;
}

function detalleRows_(pedidoId, lineas) {
  return lineas.map(function (l) {
    return Object.assign({ detalle_id: uuid_(), pedido_id: pedidoId, cantidad_preparada: '0' }, l);
  });
}

/** Siguiente número de pedido legible y único. Debe ejecutarse dentro del bloqueo. */
function nextNumeroPedido_() {
  const cfgRows = readTable_('Configuracion');
  const row = cfgRows.filter(function (r) { return r.clave === 'consecutivo_pedidos'; })[0];
  if (!row) throw appError_('DB_ESTRUCTURA', 'Falta la clave "consecutivo_pedidos" en Configuracion. Ejecute setupDatabase().');
  const prefRow = cfgRows.filter(function (r) { return r.clave === 'prefijo_pedidos'; })[0];
  const prefijo = (prefRow && prefRow.valor) || 'PED';
  const usados = {};
  readTable_('Pedidos').forEach(function (p) { usados[p.numero_pedido] = true; });
  let n = Math.max(0, Math.floor(Number(row.valor) || 0));
  let numero;
  do { n++; numero = prefijo + '-' + ('000000' + n).slice(-6); } while (usados[numero]);
  row.valor = String(n);
  updateRow_('Configuracion', row);
  return numero;
}

/* ===================== Crear / editar ===================== */

function createPedido_(p, u) {
  const usuarios = indexBy_(readTable_('Usuarios'), 'usuario_id');
  const data = validatePedidoInput_(p, usuarios);
  if (data.fecha_estimada_entrega < today_()) throw appError_('VALIDACION', 'La fecha estimada de entrega no puede ser anterior a hoy.');
  const lineas = validateLineas_(p.lineas, productosMap_());
  const rutaId = vId_(p.ruta_id, 'Ruta', false);
  if (rutaId) {
    requirePerm_(u, 'rutas.asignar');
    assertRutaAsignable_(rutaId, 1);
  }
  const now = now_();
  const pedido = Object.assign({}, data, {
    pedido_id: uuid_(),
    numero_pedido: nextNumeroPedido_(),
    fecha_creacion: now,
    fecha_actualizacion: now,
    estado: 'Pendiente',
    ruta_id: rutaId,
    creado_por: u.correo,
    actualizado_por: u.correo,
    anulado: 'NO',
    version: '1',
    es_demo: 'NO'
  });
  // Primero el detalle: si fallara la escritura del pedido, las líneas huérfanas no aparecen en ninguna vista.
  appendRows_('DetallePedidos', detalleRows_(pedido.pedido_id, lineas));
  appendRows_('Pedidos', [pedido]);
  const hist = [{ entidad: 'Pedido', entidad_id: pedido.pedido_id, accion: 'CREAR', nuevo: 'Pendiente',
    observacion: pedido.numero_pedido + ' · ' + lineas.length + ' línea(s)' }];
  if (rutaId) hist.push({ entidad: 'Pedido', entidad_id: pedido.pedido_id, accion: 'ASIGNAR_RUTA', nuevo: rutaId });
  logHistory_(hist, u);
  return { pedido_id: pedido.pedido_id, numero_pedido: pedido.numero_pedido };
}

/** Campos que cada rol puede modificar según el estado del pedido. */
function editableFields_(u, ped) {
  if (!can_(u, 'pedidos.editar') || ped.anulado === 'SI') return [];
  if (ped.estado === 'Entregado') return u.rol === ROL.ADMIN ? ['observaciones', 'observaciones_internas'] : [];
  if (ped.estado === 'Despachado') {
    return u.rol === ROL.ADMIN ? PEDIDO_CAMPOS_BASE.slice() : ['observaciones', 'observaciones_internas'];
  }
  return PEDIDO_CAMPOS_BASE.slice();
}

function lineasEditables_(u, ped) {
  return can_(u, 'pedidos.editar') && ped.anulado !== 'SI' && ped.estado === 'Pendiente';
}

function updatePedido_(p, u) {
  const ped = loadPedido_(p.pedido_id, p.version);
  const allowed = editableFields_(u, ped);
  if (!allowed.length) throw appError_('ESTADO_INVALIDO', 'El estado actual del pedido no permite modificarlo.');
  const usuarios = indexBy_(readTable_('Usuarios'), 'usuario_id');
  const data = validatePedidoInput_(p, usuarios);
  if (data.fecha_estimada_entrega !== ped.fecha_estimada_entrega && data.fecha_estimada_entrega < ped.fecha_creacion.slice(0, 10)) {
    throw appError_('VALIDACION', 'La fecha estimada de entrega no puede ser anterior a la fecha de creación.');
  }
  const anterior = {}, nuevo = {};
  allowed.forEach(function (k) {
    if (data[k] !== ped[k]) { anterior[k] = ped[k]; nuevo[k] = data[k]; ped[k] = data[k]; }
  });

  if (p.ruta_id !== undefined) {
    const rutaId = vId_(p.ruta_id, 'Ruta', false);
    if (rutaId !== ped.ruta_id) {
      requirePerm_(u, 'rutas.asignar');
      if (ESTADOS_ASIGNABLES.indexOf(ped.estado) < 0) throw appError_('ESTADO_INVALIDO', 'Solo se puede cambiar la ruta de pedidos pendientes o en preparación.');
      if (rutaId) assertRutaAsignable_(rutaId, 1);
      anterior.ruta_id = ped.ruta_id; nuevo.ruta_id = rutaId; ped.ruta_id = rutaId;
    }
  }

  if (vBool_(p.lineasModificadas)) {
    if (!lineasEditables_(u, ped)) throw appError_('ESTADO_INVALIDO', 'Solo se pueden modificar los productos de pedidos pendientes.');
    const lineas = validateLineas_(p.lineas, productosMap_());
    const viejas = readTable_('DetallePedidos').filter(function (d) { return d.pedido_id === ped.pedido_id; });
    deleteRows_('DetallePedidos', viejas);
    appendRows_('DetallePedidos', detalleRows_(ped.pedido_id, lineas));
    anterior.lineas = viejas.map(function (d) { return d.sku + ' x ' + d.cantidad; }).join('; ');
    nuevo.lineas = lineas.map(function (d) { return d.sku + ' x ' + d.cantidad; }).join('; ');
  }

  if (!Object.keys(nuevo).length) return { sinCambios: true, version: ped.version };
  savePedido_(ped, u);
  logHistory_([{ entidad: 'Pedido', entidad_id: ped.pedido_id, accion: 'EDITAR', anterior: anterior, nuevo: nuevo,
    observacion: vStr_(p.motivo, 'Motivo', { max: 500 }) }], u);
  return { version: ped.version };
}

function duplicatePedido_(p, u) {
  const orig = findPedido_(p.pedido_id);
  const prodMap = productosMap_();
  const lineas = readTable_('DetallePedidos').filter(function (d) { return d.pedido_id === orig.pedido_id; })
    .map(function (d) {
      const prod = prodMap[d.producto_id];
      if (!prod || prod.activo !== 'SI') throw appError_('VALIDACION', 'No se puede duplicar: el producto "' + d.nombre_producto + '" ya no está activo.');
      return { producto_id: d.producto_id, cantidad: d.cantidad, precio_unitario: d.precio_unitario, observaciones: d.observaciones };
    });
  const hoy = today_();
  const datos = {};
  PEDIDO_CAMPOS_BASE.forEach(function (k) { datos[k] = orig[k]; });
  datos.fecha_estimada_entrega = orig.fecha_estimada_entrega >= hoy ? orig.fecha_estimada_entrega : hoy;
  const usuarios = indexBy_(readTable_('Usuarios'), 'usuario_id');
  if (datos.responsable_id && (!usuarios[datos.responsable_id] || usuarios[datos.responsable_id].activo !== 'SI')) datos.responsable_id = '';
  datos.lineas = lineas;
  const res = createPedido_(datos, u);
  logHistory_([{ entidad: 'Pedido', entidad_id: res.pedido_id, accion: 'DUPLICAR', anterior: orig.numero_pedido, nuevo: res.numero_pedido }], u);
  return res;
}

/* ===================== Anular / eliminar ===================== */

function anularPedido_(p, u) {
  const ped = loadPedido_(p.pedido_id, p.version);
  if (ped.anulado === 'SI') throw appError_('ESTADO_INVALIDO', 'El pedido ya está anulado.');
  if (ped.estado === 'Entregado') throw appError_('ESTADO_INVALIDO', 'Un pedido entregado no puede anularse.');
  const motivo = vJustificacion_(p.motivo);
  ped.anulado = 'SI';
  ped.motivo_anulacion = motivo;
  savePedido_(ped, u);
  logHistory_([{ entidad: 'Pedido', entidad_id: ped.pedido_id, accion: 'ANULAR', anterior: ped.estado, nuevo: 'Anulado', observacion: motivo }], u);
  return { ok: true };
}

/** Eliminación física solo para pedidos sin movimientos logísticos (pendientes, sin ruta ni preparación). */
function eliminarPedido_(p, u) {
  const ped = loadPedido_(p.pedido_id, p.version);
  if (ped.estado !== 'Pendiente' || ped.ruta_id || ped.fecha_inicio_preparacion) {
    throw appError_('ESTADO_INVALIDO', 'Solo se pueden eliminar pedidos pendientes sin ruta ni preparación. Use la anulación para conservar la trazabilidad.');
  }
  const motivo = vJustificacion_(p.motivo);
  const detalles = readTable_('DetallePedidos').filter(function (d) { return d.pedido_id === ped.pedido_id; });
  deleteRows_('Pedidos', [ped]);
  deleteRows_('DetallePedidos', detalles);
  logHistory_([{ entidad: 'Pedido', entidad_id: ped.pedido_id, accion: 'ELIMINAR', anterior: ped.numero_pedido + ' · ' + ped.cliente_nombre,
    nuevo: 'Eliminado', observacion: motivo }], u);
  return { ok: true };
}

// ===== src/Flujo.gs =====
/**
 * Flujo.gs — Máquina de estados del pedido: preparación, despacho, entrega y reversiones autorizadas.
 * Flujo normal: Pendiente → En preparación → Despachado → Entregado. Todas las transiciones se validan aquí.
 */

function histPedido_(ped, accion, anterior, nuevo, observacion) {
  return { entidad: 'Pedido', entidad_id: ped.pedido_id, accion: accion, anterior: anterior, nuevo: nuevo, observacion: observacion || '' };
}

function iniciarPreparacion_(p, u) {
  const ped = loadPedido_(p.pedido_id, p.version);
  assertTransition_(ped, 'En preparación');
  const obs = vStr_(p.observacion, 'Observación', { max: 500 });
  ped.estado = 'En preparación';
  ped.fecha_inicio_preparacion = now_();
  ped.preparador_id = u.usuario_id;
  savePedido_(ped, u);
  logHistory_([histPedido_(ped, 'INICIAR_PREPARACION', 'Pendiente', 'En preparación', obs)], u);
  return { version: ped.version };
}

/** Registra cantidades alistadas por línea y, si se solicita y todo está completo, finaliza la preparación. */
function registrarPreparacion_(p, u) {
  const ped = loadPedido_(p.pedido_id, p.version);
  if (ped.anulado === 'SI' || ped.estado !== 'En preparación') {
    throw appError_('ESTADO_INVALIDO', 'Solo se puede registrar el alistamiento de pedidos en preparación.');
  }
  if (ped.fecha_fin_preparacion) throw appError_('ESTADO_INVALIDO', 'La preparación de este pedido ya fue finalizada.');
  const obs = vStr_(p.observacion, 'Observación', { max: 500 });
  const detalles = readTable_('DetallePedidos').filter(function (d) { return d.pedido_id === ped.pedido_id; });
  const input = {};
  (Array.isArray(p.lineas) ? p.lineas : []).forEach(function (l) { if (l) input[String(l.detalle_id)] = l; });
  const cambiadas = [];
  detalles.forEach(function (d) {
    const l = input[d.detalle_id];
    if (!l) return;
    const q = vNumber_(l.cantidad_preparada, 'Cantidad preparada de ' + d.nombre_producto, { required: true, min: 0, max: Number(d.cantidad) });
    if (Number(d.cantidad_preparada || 0) !== q) { d.cantidad_preparada = String(q); cambiadas.push(d); }
  });
  const completo = detalles.length > 0 && detalles.every(function (d) { return Number(d.cantidad_preparada || 0) >= Number(d.cantidad); });
  const finalizar = vBool_(p.finalizar);
  // Se valida antes de escribir para no dejar cantidades guardadas a medias si la operación se rechaza.
  if (finalizar && !completo) throw appError_('VALIDACION', 'No se puede finalizar: hay productos con cantidades pendientes de alistar.');
  updateRows_('DetallePedidos', cambiadas);

  const hist = [];
  if (cambiadas.length) {
    hist.push(histPedido_(ped, 'REGISTRAR_ALISTAMIENTO', '', cambiadas.map(function (d) {
      return d.sku + ': ' + d.cantidad_preparada + '/' + d.cantidad;
    }).join('; '), obs));
  }
  if (finalizar) {
    ped.fecha_fin_preparacion = now_();
    hist.push(histPedido_(ped, 'FINALIZAR_PREPARACION', 'En preparación', 'Preparación completa', obs));
  }
  if (hist.length) {
    savePedido_(ped, u);
    logHistory_(hist, u);
  }
  return { completo: completo, finalizado: !!ped.fecha_fin_preparacion, version: ped.version };
}

function despachar_(p, u) {
  const ped = loadPedido_(p.pedido_id, p.version);
  assertTransition_(ped, 'Despachado');
  if (!ped.ruta_id) throw appError_('VALIDACION', 'Asigne una ruta al pedido antes de despacharlo.');
  const ruta = readTable_('Rutas').filter(function (r) { return r.ruta_id === ped.ruta_id; })[0];
  if (!ruta || (ruta.estado !== 'planificada' && ruta.estado !== 'activa')) {
    throw appError_('ESTADO_INVALIDO', 'La ruta asignada no está planificada ni activa.');
  }
  const obs = vStr_(p.observacion, 'Observación', { max: 500 });
  const hist = [];
  if (!ped.fecha_fin_preparacion) {
    if (!vBool_(p.excepcion)) {
      throw appError_('ESTADO_INVALIDO', 'El pedido no ha completado la preparación. Solo un administrador puede despacharlo como excepción justificada.');
    }
    requirePerm_(u, 'excepciones.autorizar');
    hist.push(histPedido_(ped, 'EXCEPCION_DESPACHO', 'Preparación incompleta', 'Despacho autorizado', vJustificacion_(p.justificacion)));
  }
  ped.estado = 'Despachado';
  ped.fecha_despacho = now_();
  savePedido_(ped, u);
  hist.push(histPedido_(ped, 'DESPACHAR', 'En preparación', 'Despachado', (obs ? obs + ' · ' : '') + 'Ruta ' + ruta.codigo_ruta));
  logHistory_(hist, u);
  return { version: ped.version };
}

function registrarEntrega_(p, u) {
  const ped = loadPedido_(p.pedido_id, p.version);
  assertTransition_(ped, 'Entregado');
  if (!vBool_(p.confirmado)) throw appError_('VALIDACION', 'Debe confirmar que la entrega fue realizada.');
  const fecha = vDateTime_(p.fecha_entrega, 'Fecha y hora de entrega', true);
  if (parseDT_(fecha).getTime() > Date.now() + 5 * 60000) throw appError_('VALIDACION', 'La fecha de entrega no puede ser futura.');
  if (ped.fecha_despacho && fecha < ped.fecha_despacho.slice(0, 16) + ':00') {
    throw appError_('VALIDACION', 'La fecha de entrega no puede ser anterior a la fecha de despacho.');
  }
  ped.estado = 'Entregado';
  ped.fecha_entrega = fecha;
  ped.recibido_por = vStr_(p.recibido_por, 'Persona que recibe', { max: 120 });
  ped.observacion_entrega = vStr_(p.observacion_entrega, 'Observación del repartidor', { max: 500 });
  savePedido_(ped, u);
  logHistory_([histPedido_(ped, 'ENTREGAR', 'Despachado', 'Entregado',
    [ped.recibido_por ? 'Recibió: ' + ped.recibido_por : '', ped.observacion_entrega].filter(String).join(' · '))], u);
  return { version: ped.version };
}

/** Devuelve el pedido al estado anterior. Requiere permiso de excepciones y justificación; queda auditado. */
function revertirEstado_(p, u) {
  const ped = loadPedido_(p.pedido_id, p.version);
  if (ped.anulado === 'SI') throw appError_('ESTADO_INVALIDO', 'El pedido está anulado.');
  const destino = ESTADO_ANTERIOR[ped.estado];
  if (!destino) throw appError_('ESTADO_INVALIDO', 'El estado actual no tiene un estado anterior al que volver.');
  const just = vJustificacion_(p.justificacion);
  const origen = ped.estado;
  if (origen === 'Entregado') { ped.fecha_entrega = ''; ped.recibido_por = ''; ped.observacion_entrega = ''; }
  if (origen === 'Despachado') { ped.fecha_despacho = ''; }
  if (origen === 'En preparación') { ped.fecha_inicio_preparacion = ''; ped.fecha_fin_preparacion = ''; ped.preparador_id = ''; }
  ped.estado = destino;
  savePedido_(ped, u);
  logHistory_([histPedido_(ped, 'EXCEPCION_REVERSION', origen, destino, just)], u);
  return { version: ped.version, estado: destino };
}

// ===== src/Rutas.gs =====
/**
 * Rutas.gs — Administración de rutas de distribución y asignación MANUAL de pedidos.
 * No hay optimización geográfica de recorridos (no se integra ningún servicio de mapas).
 * Capacidad: número máximo de pedidos abiertos (no entregados ni anulados) asignados a la ruta.
 */

function rutaConteos_(rutaId, pedidos) {
  const c = { total: 0, 'Pendiente': 0, 'En preparación': 0, 'Despachado': 0, 'Entregado': 0, preparados: 0 };
  pedidos.forEach(function (p) {
    if (p.ruta_id !== rutaId || p.anulado === 'SI') return;
    c.total++;
    c[p.estado] = (c[p.estado] || 0) + 1;
    if (p.estado === 'En preparación' && p.fecha_fin_preparacion) c.preparados++;
  });
  return c;
}

function listRutas_(f) {
  const estado = vEnum_(f.estado, RUTA_ESTADOS, 'Estado', false);
  const desde = vDate_(f.desde, 'Desde', false);
  const hasta = vDate_(f.hasta, 'Hasta', false);
  const usuarios = indexBy_(readTable_('Usuarios'), 'usuario_id');
  const pedidos = readTable_('Pedidos');
  return readTable_('Rutas').filter(function (r) {
    return (!estado || r.estado === estado) && (!desde || r.fecha_operacion >= desde) && (!hasta || r.fecha_operacion <= hasta);
  }).map(function (r) {
    const o = clean_(r);
    o.responsable_nombre = usuarios[r.responsable_id] ? usuarios[r.responsable_id].nombre : '';
    o.conteos = rutaConteos_(r.ruta_id, pedidos);
    return o;
  }).sort(function (a, b) { return a.fecha_operacion < b.fecha_operacion ? 1 : a.fecha_operacion > b.fecha_operacion ? -1 : a.codigo_ruta.localeCompare(b.codigo_ruta); });
}

function findRuta_(id) {
  const rid = vId_(id, 'Ruta', true);
  const r = readTable_('Rutas').filter(function (x) { return x.ruta_id === rid; })[0];
  if (!r) throw appError_('NO_ENCONTRADO', 'No se encontró la ruta.');
  return r;
}

function getRuta_(p) {
  const r = findRuta_(p.ruta_id);
  const ctx = refCtx_();
  const today = today_();
  const todos = readTable_('Pedidos');
  const pedidos = todos.filter(function (x) { return x.ruta_id === r.ruta_id && x.anulado !== 'SI'; })
    .map(function (x) { return summarizePedido_(x, ctx, today); })
    .sort(function (a, b) { return ESTADOS.indexOf(a.estado) - ESTADOS.indexOf(b.estado) || a.numero_pedido.localeCompare(b.numero_pedido); });
  const o = clean_(r);
  o.responsable_nombre = ctx.usuarios[r.responsable_id] ? ctx.usuarios[r.responsable_id].nombre : '';
  return {
    ruta: o,
    conteos: rutaConteos_(r.ruta_id, todos),
    pedidos: pedidos,
    pendientesDespacho: pedidos.filter(function (x) { return ESTADOS_ASIGNABLES.indexOf(x.estado) >= 0; })
  };
}

function saveRuta_(p, u) {
  const rutas = readTable_('Rutas');
  const id = vId_(p.ruta_id, 'Ruta', false);
  const usuarios = indexBy_(readTable_('Usuarios'), 'usuario_id');
  const data = {
    codigo_ruta: vStr_(p.codigo_ruta, 'Código de ruta', { required: true, max: 30 }).toUpperCase(),
    nombre_ruta: vStr_(p.nombre_ruta, 'Nombre de ruta', { required: true, max: 100 }),
    descripcion: vStr_(p.descripcion, 'Descripción', { max: 500 }),
    zona: vStr_(p.zona, 'Ciudad o zona atendida', { required: true, max: 120 }),
    fecha_operacion: vDate_(p.fecha_operacion, 'Fecha de operación', true),
    responsable_id: vId_(p.responsable_id, 'Responsable', false),
    vehiculo: vStr_(p.vehiculo, 'Vehículo', { max: 60 }),
    capacidad: vNumber_(p.capacidad, 'Capacidad', { integer: true, min: 1, max: 10000 }),
    observaciones: vStr_(p.observaciones, 'Observaciones', { max: 1000 })
  };
  if (data.responsable_id && (!usuarios[data.responsable_id] || usuarios[data.responsable_id].activo !== 'SI')) {
    throw appError_('VALIDACION', 'El responsable seleccionado no existe o está inactivo.');
  }
  const dup = rutas.filter(function (r) { return r.codigo_ruta.toUpperCase() === data.codigo_ruta && r.ruta_id !== id; })[0];
  if (dup) throw appError_('VALIDACION', 'Ya existe una ruta con el código ' + data.codigo_ruta + '.');
  const now = now_();
  if (!id) {
    const nueva = Object.assign({ ruta_id: uuid_(), estado: 'planificada', fecha_creacion: now, fecha_actualizacion: now, es_demo: 'NO' }, data);
    appendRows_('Rutas', [nueva]);
    logHistory_([{ entidad: 'Ruta', entidad_id: nueva.ruta_id, accion: 'CREAR', nuevo: data.codigo_ruta }], u);
    return clean_(nueva);
  }
  const actual = findRuta_(id);
  if (actual.estado === 'finalizada' || actual.estado === 'cancelada') {
    if (actual.observaciones === data.observaciones) throw appError_('ESTADO_INVALIDO', 'En una ruta ' + actual.estado + ' solo se pueden editar las observaciones.');
    const ant = actual.observaciones;
    actual.observaciones = data.observaciones;
    actual.fecha_actualizacion = now;
    updateRow_('Rutas', actual);
    logHistory_([{ entidad: 'Ruta', entidad_id: id, accion: 'EDITAR', anterior: { observaciones: ant }, nuevo: { observaciones: data.observaciones } }], u);
    return clean_(actual);
  }
  if (data.capacidad !== '') {
    const abiertos = readTable_('Pedidos').filter(function (x) { return x.ruta_id === id && x.anulado !== 'SI' && x.estado !== 'Entregado'; }).length;
    if (abiertos > data.capacidad) throw appError_('VALIDACION', 'La capacidad no puede ser menor que los pedidos abiertos asignados (' + abiertos + ').');
  }
  const anterior = {}, nuevo = {};
  Object.keys(data).forEach(function (k) {
    if (String(data[k]) !== String(actual[k])) { anterior[k] = actual[k]; nuevo[k] = data[k]; actual[k] = data[k]; }
  });
  if (!Object.keys(nuevo).length) return clean_(actual);
  actual.fecha_actualizacion = now;
  updateRow_('Rutas', actual);
  logHistory_([{ entidad: 'Ruta', entidad_id: id, accion: 'EDITAR', anterior: anterior, nuevo: nuevo }], u);
  return clean_(actual);
}

/**
 * Cambia el estado de la ruta. Nunca modifica el estado de los pedidos:
 *  - finalizada: los pedidos no despachados se liberan de la ruta (quedan "sin ruta" para reasignarse);
 *    los despachados sin entregar conservan la ruta y se informan como pendientes de confirmar entrega.
 *  - cancelada: solo administradores; se rechaza si hay pedidos despachados sin entregar.
 */
function cambiarEstadoRuta_(p, u) {
  const r = findRuta_(p.ruta_id);
  const destino = vEnum_(p.estado, RUTA_ESTADOS, 'Estado de ruta');
  if ((RUTA_TRANSICIONES[r.estado] || []).indexOf(destino) < 0) {
    throw appError_('ESTADO_INVALIDO', 'Una ruta ' + r.estado + ' no puede pasar a ' + destino + '.');
  }
  if (destino === 'cancelada') requirePerm_(u, 'rutas.gestionar');
  const obs = vStr_(p.observacion, 'Observación', { max: 500 });
  if (destino === 'cancelada' && obs.length < 10) throw appError_('VALIDACION', 'Indique el motivo de la cancelación (mínimo 10 caracteres).');

  const pedidos = readTable_('Pedidos').filter(function (x) { return x.ruta_id === r.ruta_id && x.anulado !== 'SI'; });
  const enCamino = pedidos.filter(function (x) { return x.estado === 'Despachado'; });
  if (destino === 'cancelada' && enCamino.length) {
    throw appError_('ESTADO_INVALIDO', 'No se puede cancelar: hay ' + enCamino.length + ' pedido(s) despachados sin entrega registrada.');
  }
  const hist = [{ entidad: 'Ruta', entidad_id: r.ruta_id, accion: 'CAMBIAR_ESTADO', anterior: r.estado, nuevo: destino, observacion: obs }];
  let liberados = [];
  if (destino === 'finalizada' || destino === 'cancelada') {
    liberados = pedidos.filter(function (x) { return ESTADOS_ASIGNABLES.indexOf(x.estado) >= 0; });
    liberados.forEach(function (x) {
      x.ruta_id = '';
      savePedido_(x, u);
      hist.push({ entidad: 'Pedido', entidad_id: x.pedido_id, accion: 'RETIRAR_RUTA', anterior: r.ruta_id, nuevo: '',
        observacion: 'Ruta ' + r.codigo_ruta + ' ' + destino });
    });
  }
  r.estado = destino;
  r.fecha_actualizacion = now_();
  updateRow_('Rutas', r);
  logHistory_(hist, u);
  return { estado: destino, liberados: liberados.length, despachadosSinEntrega: enCamino.length };
}

function asignarPedidos_(p, u) {
  const r = findRuta_(p.ruta_id);
  const ids = Array.isArray(p.pedido_ids) ? p.pedido_ids.slice(0, 200).map(function (x) { return vId_(x, 'Pedido', true); }) : [];
  if (!ids.length) throw appError_('VALIDACION', 'Seleccione al menos un pedido.');
  const pedidos = indexBy_(readTable_('Pedidos'), 'pedido_id');
  const versiones = p.versiones && typeof p.versiones === 'object' ? p.versiones : {};
  const objetivo = [];
  ids.forEach(function (id) {
    const ped = pedidos[id];
    if (!ped) throw appError_('NO_ENCONTRADO', 'Uno de los pedidos seleccionados no existe.');
    if (versiones[id] !== undefined && String(versiones[id]) !== String(ped.version)) {
      throw appError_('CONFLICTO', 'El pedido ' + ped.numero_pedido + ' fue modificado por otro proceso. Recargue e intente de nuevo.');
    }
    if (ped.anulado === 'SI') throw appError_('ESTADO_INVALIDO', 'El pedido ' + ped.numero_pedido + ' está anulado.');
    if (ESTADOS_ASIGNABLES.indexOf(ped.estado) < 0) throw appError_('ESTADO_INVALIDO', 'El pedido ' + ped.numero_pedido + ' está ' + ped.estado + ' y no puede asignarse.');
    if (ped.ruta_id !== r.ruta_id && objetivo.indexOf(ped) < 0) objetivo.push(ped);
  });
  assertRutaAsignable_(r.ruta_id, objetivo.length);
  const hist = [];
  objetivo.forEach(function (ped) {
    hist.push({ entidad: 'Pedido', entidad_id: ped.pedido_id, accion: 'ASIGNAR_RUTA', anterior: ped.ruta_id, nuevo: r.ruta_id, observacion: 'Ruta ' + r.codigo_ruta });
    ped.ruta_id = r.ruta_id;
    savePedido_(ped, u);
  });
  logHistory_(hist, u);
  return { asignados: objetivo.map(function (x) { return { pedido_id: x.pedido_id, version: x.version }; }) };
}

function retirarPedido_(p, u) {
  const ped = loadPedido_(p.pedido_id, p.version);
  if (!ped.ruta_id) throw appError_('VALIDACION', 'El pedido no tiene ruta asignada.');
  if (ESTADOS_ASIGNABLES.indexOf(ped.estado) < 0) throw appError_('ESTADO_INVALIDO', 'No se puede retirar de la ruta un pedido ' + ped.estado.toLowerCase() + '.');
  const anterior = ped.ruta_id;
  ped.ruta_id = '';
  savePedido_(ped, u);
  logHistory_([{ entidad: 'Pedido', entidad_id: ped.pedido_id, accion: 'RETIRAR_RUTA', anterior: anterior, nuevo: '',
    observacion: vStr_(p.observacion, 'Observación', { max: 500 }) }], u);
  return { version: ped.version };
}

// ===== src/Reportes.gs =====
/**
 * Reportes.gs — Dashboard (indicadores, gráficos, alertas) e informes con exportación CSV y PDF.
 * Todo se calcula en el servidor a partir de la hoja; el navegador solo envía filtros.
 * Los pedidos anulados nunca se cuentan; cada pedido se cuenta una sola vez por indicador.
 */

function pedidosVigentes_(cfg) {
  return readTable_('Pedidos').filter(function (p) {
    return p.anulado !== 'SI' && (cfg.incluir_demo_en_reportes !== 'NO' || p.es_demo !== 'SI');
  });
}

function periodRange_(p) {
  const today = today_();
  const tipo = vEnum_(p.tipo || '7d', ['hoy', '7d', '30d', 'rango'], 'Período');
  if (tipo === 'hoy') return { desde: today, hasta: today, label: 'Hoy' };
  if (tipo === '7d') return { desde: addDays_(today, -6), hasta: today, label: 'Últimos 7 días' };
  if (tipo === '30d') return { desde: addDays_(today, -29), hasta: today, label: 'Últimos 30 días' };
  const desde = vDate_(p.desde, 'Desde', true);
  const hasta = vDate_(p.hasta, 'Hasta', true);
  if (desde > hasta) throw appError_('VALIDACION', 'La fecha inicial no puede ser posterior a la final.');
  if ((parseDT_(hasta) - parseDT_(desde)) / 86400000 > 366) throw appError_('VALIDACION', 'El rango máximo es de 366 días.');
  return { desde: desde, hasta: hasta, label: dmy_(desde) + ' – ' + dmy_(hasta) };
}

function daysBetween_(desde, hasta) {
  const out = [];
  for (let d = desde; d <= hasta; d = addDays_(d, 1)) out.push(d);
  return out;
}

function getDashboard_(p) {
  const cfg = getConfig_();
  const today = today_();
  const range = periodRange_(p || {});
  const peds = pedidosVigentes_(cfg);
  const ctx = refCtx_();
  const inR = function (s) { const d = String(s || '').slice(0, 10); return !!d && d >= range.desde && d <= range.hasta; };

  const kpis = { total: peds.length, pendientes: 0, preparacion: 0, despachados: 0, entregados: 0, retrasados: 0, creadosHoy: 0, entregadosHoy: 0 };
  peds.forEach(function (x) {
    if (x.estado === 'Pendiente') kpis.pendientes++;
    else if (x.estado === 'En preparación') kpis.preparacion++;
    else if (x.estado === 'Despachado') kpis.despachados++;
    else if (x.estado === 'Entregado') kpis.entregados++;
    if (isRetrasado_(x, today)) kpis.retrasados++;
    if (x.fecha_creacion.slice(0, 10) === today) kpis.creadosHoy++;
    if (x.estado === 'Entregado' && x.fecha_entrega.slice(0, 10) === today) kpis.entregadosHoy++;
  });

  const periodo = peds.filter(function (x) { return inR(x.fecha_creacion); });
  const dias = daysBetween_(range.desde, range.hasta);
  const idx = {};
  dias.forEach(function (d, i) { idx[d] = i; });
  const creados = dias.map(function () { return 0; });
  const desp = dias.map(function () { return 0; });
  const ent = dias.map(function () { return 0; });
  periodo.forEach(function (x) { creados[idx[x.fecha_creacion.slice(0, 10)]]++; });
  peds.forEach(function (x) {
    if (x.fecha_despacho && inR(x.fecha_despacho)) desp[idx[x.fecha_despacho.slice(0, 10)]]++;
    if (x.estado === 'Entregado' && inR(x.fecha_entrega)) ent[idx[x.fecha_entrega.slice(0, 10)]]++;
  });

  const porRuta = {}, porResp = {};
  periodo.forEach(function (x) {
    if (x.ruta_id) {
      const r = porRuta[x.ruta_id] || (porRuta[x.ruta_id] = { nombre: rutaLabel_(ctx.rutas[x.ruta_id]) || 'Ruta eliminada', total: 0, entregados: 0, aTiempo: 0 });
      r.total++;
      if (x.estado === 'Entregado') { r.entregados++; if (x.fecha_entrega.slice(0, 10) <= x.fecha_estimada_entrega) r.aTiempo++; }
    }
    const key = x.responsable_id || '__none';
    const nombre = x.responsable_id ? (ctx.usuarios[x.responsable_id] ? ctx.usuarios[x.responsable_id].nombre : 'Usuario eliminado') : 'Sin responsable';
    porResp[key] = porResp[key] || { nombre: nombre, total: 0 };
    porResp[key].total++;
  });

  return {
    generado: now_(),
    periodo: range,
    kpis: kpis,
    porEstado: ESTADOS.map(function (e) { return { estado: e, total: periodo.filter(function (x) { return x.estado === e; }).length }; }),
    evolucion: { dias: dias, creados: creados, despachados: desp, entregados: ent },
    rutas: Object.keys(porRuta).map(function (k) { return porRuta[k]; }).sort(function (a, b) { return b.total - a.total; }).slice(0, 12),
    responsables: Object.keys(porResp).map(function (k) { return porResp[k]; }).sort(function (a, b) { return b.total - a.total; }).slice(0, 12),
    alertas: computeAlertas_(peds, cfg, ctx)
  };
}

/** Alertas informativas: nunca cambian el estado de los pedidos. */
function computeAlertas_(peds, cfg, ctx) {
  const ahora = new Date();
  const hPend = cfgNum_(cfg, 'alerta_pendiente_horas', 24);
  const hPrep = cfgNum_(cfg, 'alerta_preparacion_horas', 4);
  const hEnt = cfgNum_(cfg, 'alerta_entrega_horas', 0);
  const item = function (x, detalle) {
    return { pedido_id: x.pedido_id, numero_pedido: x.numero_pedido, cliente_nombre: x.cliente_nombre, prioridad: x.prioridad, detalle: detalle };
  };
  const pend = [], prep = [], venc = [], sinRuta = [], sinResp = [];
  peds.forEach(function (x) {
    if (x.estado === 'Pendiente') {
      const h = hoursSince_(x.fecha_creacion, ahora);
      if (h > hPend) pend.push(item(x, 'Pendiente hace ' + Math.floor(h) + ' h (límite ' + hPend + ' h)'));
    }
    if (x.estado === 'En preparación' && !x.fecha_fin_preparacion && x.fecha_inicio_preparacion) {
      const h = hoursSince_(x.fecha_inicio_preparacion, ahora);
      if (h > hPrep) prep.push(item(x, 'En preparación hace ' + Math.floor(h * 10) / 10 + ' h (límite ' + hPrep + ' h)'));
    }
    if (x.estado === 'Despachado' && x.fecha_estimada_entrega) {
      const limite = parseDT_(x.fecha_estimada_entrega + ' 23:59:59').getTime() + hEnt * 3600000;
      if (ahora.getTime() > limite) venc.push(item(x, 'Entrega estimada el ' + dmy_(x.fecha_estimada_entrega)));
    }
    if (ESTADOS_ASIGNABLES.indexOf(x.estado) >= 0 && !x.ruta_id) sinRuta.push(item(x, x.estado));
    if (x.estado !== 'Entregado' && !x.responsable_id) sinResp.push(item(x, x.estado));
  });
  const grupo = function (clave, titulo, nivel, items) {
    return { clave: clave, titulo: titulo, nivel: nivel, total: items.length, items: items.slice(0, 50) };
  };
  return [
    grupo('pendientes', 'Pendientes durante demasiado tiempo', 'warning', pend),
    grupo('preparacion', 'Preparación por encima del tiempo esperado', 'warning', prep),
    grupo('vencidos', 'Despachados con fecha estimada vencida', 'error', venc),
    grupo('sinRuta', 'Pedidos sin ruta asignada', 'info', sinRuta),
    grupo('sinResponsable', 'Pedidos sin responsable asignado', 'info', sinResp)
  ];
}

/* ===================== Informes ===================== */

const REPORT_TYPES = {
  registrados: 'Pedidos registrados por período',
  estado: 'Pedidos por estado',
  despachados: 'Pedidos despachados',
  entregados: 'Pedidos entregados',
  pendientes: 'Pedidos pendientes',
  retrasados: 'Pedidos retrasados',
  ruta: 'Pedidos por ruta',
  responsable: 'Pedidos por responsable',
  historial: 'Historial de operaciones',
  rendimiento: 'Rendimiento de entregas'
};

function reportFilters_(p) {
  const f = {
    tipo: vEnum_(p.tipo, Object.keys(REPORT_TYPES), 'Tipo de informe'),
    desde: vDate_(p.desde, 'Desde', false),
    hasta: vDate_(p.hasta, 'Hasta', false),
    estado: vEnum_(p.estado, ESTADOS, 'Estado', false),
    ruta_id: vId_(p.ruta_id, 'Ruta', false),
    responsable_id: vId_(p.responsable_id, 'Responsable', false),
    prioridad: vEnum_(p.prioridad, PRIORIDADES, 'Prioridad', false)
  };
  if (f.desde && f.hasta && f.desde > f.hasta) throw appError_('VALIDACION', 'La fecha inicial no puede ser posterior a la final.');
  return f;
}

const LIST_COLS = [
  ['numero_pedido', 'Número de pedido'], ['fecha_creacion', 'Fecha de creación', 'dt'], ['cliente_nombre', 'Cliente'],
  ['ciudad', 'Ciudad'], ['zona', 'Zona'], ['estado', 'Estado'], ['prioridad', 'Prioridad'], ['ruta_nombre', 'Ruta'],
  ['responsable_nombre', 'Responsable'], ['referencias', 'Referencias', 'n'], ['unidades', 'Unidades', 'n'],
  ['fecha_estimada_entrega', 'Fecha estimada de entrega', 'd'], ['fecha_despacho', 'Fecha de despacho', 'dt'],
  ['fecha_entrega', 'Fecha de entrega', 'dt'], ['retrasado', 'Retrasado', 'b']
];

function fmtVal_(v, t) {
  if (t === 'd' || t === 'dt') return dmy_(v);
  if (t === 'b') return v ? 'Sí' : 'No';
  if (t === 'n') return v === null || v === undefined || v === '' ? '' : String(v).replace('.', ',');
  return v === null || v === undefined ? '' : String(v);
}

function listReport_(rows, ctx, today) {
  const sums = rows.map(function (x) { return summarizePedido_(x, ctx, today); });
  return {
    columnas: LIST_COLS.map(function (c) { return c[1]; }),
    filas: sums.sort(function (a, b) { return a.fecha_creacion < b.fecha_creacion ? -1 : 1; })
      .map(function (s) { return LIST_COLS.map(function (c) { return fmtVal_(s[c[0]], c[2]); }); }),
    totales: [
      { label: 'Total de pedidos', valor: String(sums.length) },
      { label: 'Total de unidades', valor: fmtVal_(Math.round(sums.reduce(function (a, s) { return a + s.unidades; }, 0) * 100) / 100, 'n') }
    ]
  };
}

function groupReport_(rows, keyFn, header, today) {
  const g = {};
  rows.forEach(function (x) {
    const k = keyFn(x);
    const o = g[k] || (g[k] = { nombre: k, total: 0, 'Pendiente': 0, 'En preparación': 0, 'Despachado': 0, 'Entregado': 0, retrasados: 0 });
    o.total++;
    o[x.estado]++;
    if (isRetrasado_(x, today)) o.retrasados++;
  });
  const lista = Object.keys(g).map(function (k) { return g[k]; }).sort(function (a, b) { return b.total - a.total; });
  const tot = { total: 0, 'Pendiente': 0, 'En preparación': 0, 'Despachado': 0, 'Entregado': 0, retrasados: 0 };
  lista.forEach(function (o) { Object.keys(tot).forEach(function (k) { tot[k] += o[k]; }); });
  const fila = function (o, nombre) { return [nombre, o.total, o['Pendiente'], o['En preparación'], o['Despachado'], o['Entregado'], o.retrasados].map(String); };
  return {
    columnas: [header, 'Total', 'Pendiente', 'En preparación', 'Despachado', 'Entregado', 'Retrasados'],
    filas: lista.map(function (o) { return fila(o, o.nombre); }).concat([fila(tot, 'TOTAL')]),
    totales: [{ label: 'Total de pedidos', valor: String(tot.total) }]
  };
}

function rendimientoReport_(rows, ctx) {
  const g = {};
  const add = function (k, x) {
    const o = g[k] || (g[k] = { nombre: k, n: 0, aTiempo: 0, hCE: 0, hDE: 0, nDE: 0 });
    o.n++;
    if (x.fecha_entrega.slice(0, 10) <= x.fecha_estimada_entrega) o.aTiempo++;
    o.hCE += Math.max(0, (parseDT_(x.fecha_entrega) - parseDT_(x.fecha_creacion)) / 3600000);
    if (x.fecha_despacho) { o.hDE += Math.max(0, (parseDT_(x.fecha_entrega) - parseDT_(x.fecha_despacho)) / 3600000); o.nDE++; }
  };
  rows.forEach(function (x) {
    add(x.ruta_id ? (rutaLabel_(ctx.rutas[x.ruta_id]) || 'Ruta eliminada') : 'Sin ruta', x);
    add('TOTAL', x);
  });
  const r1 = function (n) { return String(Math.round(n * 10) / 10).replace('.', ','); };
  const keys = Object.keys(g).filter(function (k) { return k !== 'TOTAL'; }).sort();
  if (g.TOTAL) keys.push('TOTAL');
  const filas = keys.map(function (k) {
    const o = g[k];
    return [o.nombre, String(o.n), String(o.aTiempo), String(o.n - o.aTiempo), r1(o.aTiempo * 100 / o.n) + ' %',
      r1(o.hCE / o.n), o.nDE ? r1(o.hDE / o.nDE) : ''];
  });
  const t = g.TOTAL || { n: 0, aTiempo: 0 };
  return {
    columnas: ['Ruta', 'Entregados', 'A tiempo', 'Con retraso', '% a tiempo', 'Horas promedio creación→entrega', 'Horas promedio despacho→entrega'],
    filas: filas,
    totales: [{ label: 'Pedidos entregados', valor: String(t.n) }, { label: 'Cumplimiento', valor: t.n ? r1(t.aTiempo * 100 / t.n) + ' %' : '—' }]
  };
}

function historialReport_(f) {
  const pedidos = indexBy_(readTable_('Pedidos'), 'pedido_id');
  const rows = readTable_('Historial').filter(function (h) {
    const d = h.fecha_evento.slice(0, 10);
    return (!f.desde || d >= f.desde) && (!f.hasta || d <= f.hasta);
  }).sort(function (a, b) { return a.fecha_evento < b.fecha_evento ? -1 : 1; });
  return {
    columnas: ['Fecha', 'Entidad', 'Referencia', 'Acción', 'Valor anterior', 'Valor nuevo', 'Usuario', 'Observación'],
    filas: rows.map(function (h) {
      const ref = h.entidad === 'Pedido' && pedidos[h.entidad_id] ? pedidos[h.entidad_id].numero_pedido : h.entidad_id;
      return [dmy_(h.fecha_evento), h.entidad, ref, h.accion, h.valor_anterior, h.valor_nuevo, h.usuario, h.observacion];
    }),
    totales: [{ label: 'Eventos', valor: String(rows.length) }]
  };
}

function generateReport_(p, u) {
  const f = reportFilters_(p);
  if (f.tipo === 'historial') requirePerm_(u, 'historial.ver');
  const cfg = getConfig_();
  const today = today_();
  const ctx = refCtx_();
  const inR = function (s) {
    const d = String(s || '').slice(0, 10);
    return !!d && (!f.desde || d >= f.desde) && (!f.hasta || d <= f.hasta);
  };
  const base = pedidosVigentes_(cfg).filter(function (x) {
    if (f.estado && x.estado !== f.estado) return false;
    if (f.ruta_id && (f.ruta_id === '__none' ? x.ruta_id !== '' : x.ruta_id !== f.ruta_id)) return false;
    if (f.responsable_id && (f.responsable_id === '__none' ? x.responsable_id !== '' : x.responsable_id !== f.responsable_id)) return false;
    if (f.prioridad && x.prioridad !== f.prioridad) return false;
    return true;
  });
  let rep;
  switch (f.tipo) {
    case 'registrados': rep = listReport_(base.filter(function (x) { return inR(x.fecha_creacion); }), ctx, today); break;
    case 'despachados': rep = listReport_(base.filter(function (x) { return x.fecha_despacho && inR(x.fecha_despacho); }), ctx, today); break;
    case 'entregados': rep = listReport_(base.filter(function (x) { return x.estado === 'Entregado' && inR(x.fecha_entrega); }), ctx, today); break;
    case 'pendientes': rep = listReport_(base.filter(function (x) { return x.estado === 'Pendiente' && inR(x.fecha_creacion); }), ctx, today); break;
    case 'retrasados': rep = listReport_(base.filter(function (x) { return isRetrasado_(x, today) && inR(x.fecha_creacion); }), ctx, today); break;
    case 'estado': {
      const rows = base.filter(function (x) { return inR(x.fecha_creacion); });
      rep = {
        columnas: ['Estado', 'Pedidos', 'Porcentaje'],
        filas: ESTADOS.map(function (e) {
          const n = rows.filter(function (x) { return x.estado === e; }).length;
          return [e, String(n), rows.length ? String(Math.round(n * 1000 / rows.length) / 10).replace('.', ',') + ' %' : '0 %'];
        }),
        totales: [{ label: 'Total de pedidos', valor: String(rows.length) }]
      };
      break;
    }
    case 'ruta':
      rep = groupReport_(base.filter(function (x) { return inR(x.fecha_creacion); }), function (x) {
        return x.ruta_id ? (rutaLabel_(ctx.rutas[x.ruta_id]) || 'Ruta eliminada') : 'Sin ruta';
      }, 'Ruta', today);
      break;
    case 'responsable':
      rep = groupReport_(base.filter(function (x) { return inR(x.fecha_creacion); }), function (x) {
        return x.responsable_id ? (ctx.usuarios[x.responsable_id] ? ctx.usuarios[x.responsable_id].nombre : 'Usuario eliminado') : 'Sin responsable';
      }, 'Responsable', today);
      break;
    case 'rendimiento': rep = rendimientoReport_(base.filter(function (x) { return x.estado === 'Entregado' && inR(x.fecha_entrega); }), ctx); break;
    case 'historial': rep = historialReport_(f); break;
  }
  const truncado = rep.filas.length > CONFIG.MAX_REPORT_ROWS;
  if (truncado) rep.filas = rep.filas.slice(0, CONFIG.MAX_REPORT_ROWS);

  const filtros = [];
  if (f.tipo !== 'historial') {
    if (f.estado) filtros.push('Estado: ' + f.estado);
    if (f.ruta_id) filtros.push('Ruta: ' + (f.ruta_id === '__none' ? 'Sin ruta' : rutaLabel_(ctx.rutas[f.ruta_id]) || f.ruta_id));
    if (f.responsable_id) filtros.push('Responsable: ' + (f.responsable_id === '__none' ? 'Sin responsable' : (ctx.usuarios[f.responsable_id] || {}).nombre || f.responsable_id));
    if (f.prioridad) filtros.push('Prioridad: ' + f.prioridad);
    if (cfg.incluir_demo_en_reportes === 'NO') filtros.push('Excluye datos de demostración');
  }
  return Object.assign(rep, {
    titulo: REPORT_TYPES[f.tipo],
    tipo: f.tipo,
    empresa: cfg.nombre_empresa,
    generado: dmy_(now_()),
    generadoPor: u.nombre,
    periodo: (f.desde ? dmy_(f.desde) : 'Inicio') + ' – ' + (f.hasta ? dmy_(f.hasta) : 'Hoy'),
    filtros: filtros.length ? filtros.join(' · ') : 'Sin filtros adicionales',
    truncado: truncado
  });
}

function reportFileName_(rep, ext) {
  const base = rep.titulo.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').toLowerCase();
  return base + '_' + Utilities.formatDate(new Date(), CONFIG.TZ, 'yyyyMMdd_HHmm') + '.' + ext;
}

/** CSV UTF-8 con BOM y separador ";" (compatible con Excel en configuración regional es-CO). */
function exportCsv_(p, u) {
  const rep = generateReport_(p, u);
  const lines = [rep.columnas.map(csvCell_).join(';')].concat(rep.filas.map(function (r) { return r.map(csvCell_).join(';'); }));
  return { filename: reportFileName_(rep, 'csv'), content: '﻿' + lines.join('\r\n') + '\r\n', filas: rep.filas.length };
}

function escHtml_(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/**
 * PDF tabular generado en el servidor (HTML → PDF de Apps Script).
 * Limitación: esta conversión no admite contadores CSS de página, por lo que no se numeran las páginas.
 */
function exportPdf_(p, u) {
  const rep = generateReport_(p, u);
  const filas = rep.filas.slice(0, CONFIG.MAX_PDF_ROWS);
  const aviso = rep.filas.length > CONFIG.MAX_PDF_ROWS || rep.truncado
    ? '<p class="warn">El informe se limitó a ' + filas.length + ' filas. Use la exportación CSV o filtros más específicos para ver todos los registros.</p>' : '';
  const html = '<html><head><meta charset="utf-8"><style>' +
    'body{font-family:Arial,Helvetica,sans-serif;font-size:8.5pt;color:#111827;margin:0}' +
    'h1{font-size:15pt;color:#4F46E5;margin:0 0 4px}h2{font-size:10pt;color:#475569;margin:0 0 10px;font-weight:normal}' +
    '.meta{margin-bottom:10px}.meta td{padding:1px 10px 1px 0;border:none;font-size:8.5pt}.meta td.k{color:#475569}' +
    'table.d{width:100%;border-collapse:collapse}table.d th{background:#F1F5F9;text-align:left;padding:4px;border-bottom:1px solid #CBD5E1;font-size:8pt}' +
    'table.d td{padding:3px 4px;border-bottom:1px solid #E2E8F0;font-size:8pt}thead{display:table-header-group}tr{page-break-inside:avoid}' +
    '.tot{margin-top:10px}.tot td{padding:2px 12px 2px 0;font-weight:bold}.warn{color:#D97706}.foot{margin-top:14px;color:#475569;font-size:7.5pt}' +
    '</style></head><body>' +
    '<h1>' + escHtml_(rep.titulo) + '</h1><h2>' + escHtml_(rep.empresa) + '</h2>' +
    '<table class="meta"><tr><td class="k">Fecha de generación:</td><td>' + escHtml_(rep.generado) + '</td></tr>' +
    '<tr><td class="k">Período consultado:</td><td>' + escHtml_(rep.periodo) + '</td></tr>' +
    '<tr><td class="k">Filtros aplicados:</td><td>' + escHtml_(rep.filtros) + '</td></tr>' +
    '<tr><td class="k">Generado por:</td><td>' + escHtml_(rep.generadoPor) + '</td></tr></table>' + aviso +
    '<table class="d"><thead><tr>' + rep.columnas.map(function (c) { return '<th>' + escHtml_(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    (filas.length ? filas.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + escHtml_(c) + '</td>'; }).join('') + '</tr>'; }).join('')
      : '<tr><td colspan="' + rep.columnas.length + '">No hay registros para los filtros seleccionados.</td></tr>') +
    '</tbody></table>' +
    '<table class="tot">' + rep.totales.map(function (t) { return '<tr><td>' + escHtml_(t.label) + ':</td><td>' + escHtml_(t.valor) + '</td></tr>'; }).join('') + '</table>' +
    '<p class="foot">Documento generado automáticamente por ' + escHtml_(CONFIG.APP_TITLE) + '.</p></body></html>';
  let pdf;
  try {
    pdf = Utilities.newBlob(html, 'text/html', 'informe.html').getAs('application/pdf');
  } catch (e) {
    console.error('Error al generar PDF: ' + e.message);
    throw appError_('REPORTE', 'Se produjo un error al generar el informe PDF. Intente con un rango menor.');
  }
  return { filename: reportFileName_(rep, 'pdf'), base64: Utilities.base64Encode(pdf.getBytes()), filas: filas.length };
}

/**
 * Setup.gs — Inicialización idempotente de la base de datos y datos de demostración.
 * Ejecutar desde el editor de Apps Script (solo el propietario del proyecto puede hacerlo).
 */

/** Crea hojas, encabezados y configuración faltantes. Nunca borra datos existentes. */
function setupDatabase() {
  const owner = assertOwner_();
  const log = withLock_(function () {
    const ss = ss_();
    const out = [];
    Object.keys(SCHEMA).forEach(function (name) {
      let sh = ss.getSheetByName(name);
      if (!sh) { sh = ss.insertSheet(name); out.push('Hoja creada: ' + name); }
      const cols = SCHEMA[name];
      const lastCol = sh.getLastColumn();
      if (lastCol === 0) {
        sh.getRange(1, 1, 1, cols.length).setValues([cols]);
        out.push('Encabezados creados en ' + name);
      } else {
        const hdr = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function (h) { return String(h).trim(); });
        const missing = cols.filter(function (h) { return hdr.indexOf(h) < 0; });
        if (missing.length) {
          sh.getRange(1, lastCol + 1, 1, missing.length).setValues([missing]);
          out.push('Columnas añadidas en ' + name + ': ' + missing.join(', '));
        }
      }
      const width = sh.getLastColumn();
      sh.getRange(1, 1, 1, width).setFontWeight('bold').setBackground('#F1F5F9');
      sh.setFrozenRows(1);
      // Texto plano: evita que Sheets convierta fechas, teléfonos o números de documento.
      sh.getRange(1, 1, sh.getMaxRows(), width).setNumberFormat('@');
      delete _memo['h_' + name];
    });

    const cfg = readTable_('Configuracion');
    const faltan = DEFAULT_CONFIG.filter(function (d) { return !cfg.some(function (r) { return r.clave === d[0]; }); });
    if (faltan.length) {
      appendRows_('Configuracion', faltan.map(function (d) { return { clave: d[0], valor: d[1], descripcion: d[2] }; }));
      out.push('Configuración añadida: ' + faltan.map(function (d) { return d[0]; }).join(', '));
    }

    const usuarios = readTable_('Usuarios');
    if (!usuarios.some(function (u) { return u.rol === ROL.ADMIN && u.activo === 'SI'; })) {
      const existente = usuarios.filter(function (u) { return u.correo.toLowerCase() === owner; })[0];
      if (existente) {
        existente.rol = ROL.ADMIN; existente.activo = 'SI';
        updateRow_('Usuarios', existente);
      } else {
        appendRows_('Usuarios', [{ usuario_id: uuid_(), correo: owner, nombre: 'Administrador', rol: ROL.ADMIN, activo: 'SI', fecha_creacion: now_(), es_demo: 'NO' }]);
      }
      out.push('Administrador inicial: ' + owner);
    }
    const def = ss.getSheetByName('Hoja 1') || ss.getSheetByName('Sheet1');
    if (def && def.getLastRow() === 0 && ss.getSheets().length > 1) { ss.deleteSheet(def); out.push('Hoja vacía por defecto eliminada'); }
    return out.length ? out : ['La estructura ya estaba completa. No se realizaron cambios.'];
  });
  log.forEach(function (l) { console.log(l); });
  return log;
}

/**
 * Crea datos de DEMOSTRACIÓN (marcados con es_demo = SI y prefijo [DEMO]). No sobrescribe nada.
 * Si la base está en modo producción o ya contiene pedidos reales, exige crear la propiedad de script
 * CONFIRMAR_DEMO = SI (Configuración del proyecto → Propiedades del script). La propiedad se borra al terminar.
 */
function seedDemoData() {
  assertOwner_();
  const res = withLock_(function () {
    const cfg = getConfig_();
    const props = PropertiesService.getScriptProperties();
    const pedidos = readTable_('Pedidos');
    if (pedidos.some(function (p) { return p.es_demo === 'SI'; })) {

    eq(lineasEditables_({ rol: ROL.OPER }, { estado: 'En preparación', anulado: 'NO' }), false);

  const fails = results.filter(function (r) { return r.indexOf('✘') === 0; }).length;
  results.push('— ' + (results.length - fails) + ' correctas, ' + fails + ' fallidas');
  results.forEach(function (r) { console.log(r); });

 * Scripts.html — Núcleo del frontend: comunicación con el backend,

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const COP = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
const NUM = new Intl.NumberFormat('es-CO', { maximumFractionDigits: 2 });

    .formatToParts(new Date()).map((x) => [x.type, x.value]));
}
function todayBog() { const p = bogParts(); return `${p.year}-${p.month}-${p.day}`; }

const icons = () => { if (window.lucide) lucide.createIcons(); };
const rid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);

/* ---------- Comunicación con Apps Script ---------- */
function api(action, payload = {}) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler((r) => {
        if (r && r.ok) return resolve(r.data);
        const err = (r && r.error) || { code: 'DESCONOCIDO', message: 'Respuesta inválida del servidor.' };
        if (err.code === 'NO_AUTORIZADO' || err.code === 'NO_AUTENTICADO') showFatal(err);
        reject(err);
      })
      .withFailureHandler(() => reject({ code: 'CONEXION', message: 'No se pudo conectar con el servidor. Verifique su conexión e intente nuevamente.' }))
      .api(action, payload);
  });
}

/** Ejecuta una acción de escritura: deshabilita el botón, envía un id de solicitud y muestra el resultado. */
async function run(action, payload, btn, okMsg) {
  if (btn && btn.disabled) return null;
  let html;
  if (btn) { btn.disabled = true; html = btn.innerHTML; btn.innerHTML = '<span class="spinner sm"></span> Procesando…'; }
  try {
    const r = await api(action, Object.assign({}, payload, { _requestId: rid() }));
    if (okMsg) toast(okMsg, 'ok');
    return r || {};
  } catch (e) {
    toast(errMsg(e), e.code === 'CONFLICTO' ? 'warn' : 'error');
    return null;
  } finally {
    if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = html; icons(); }
  }
}

/* ---------- Componentes ---------- */
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ic = { ok: 'check-circle', error: 'alert-circle', warn: 'alert-triangle', info: 'info' }[type] || 'info';
  el.innerHTML = `<i data-lucide="${ic}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el); icons();
  setTimeout(() => el.remove(), type === 'error' ? 7000 : 4000);
}

function openModal({ title, body, footer = '', size = '' }) {
  const el = document.createElement('div');
  el.className = 'modal-overlay';
  el.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Cerrar"><i data-lucide="x"></i></button></div>
    <div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ''}</div>`;
  $('#modalRoot').appendChild(el);
  const close = () => { el.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape' && $('#modalRoot').lastElementChild === el) close(); };
  document.addEventListener('keydown', onKey);
  el.addEventListener('click', (e) => { if (e.target === el || e.target.closest('[data-close]')) close(); });
  icons();
  const first = el.querySelector('input, select, textarea'); if (first) setTimeout(() => first.focus(), 30);
  return { el, close, body: el.querySelector('.modal-body'), foot: el.querySelector('.modal-foot') };
}

/** Diálogo de confirmación. Si se pide input, devuelve el texto escrito; si no, true. Cancelar → false. */
function confirmDialog({ title, message, confirmText = 'Confirmar', danger = false, input = null }) {
  return new Promise((resolve) => {
    const m = openModal({
      title,
      body: `<p style="margin-top:0">${message}</p>${input ? `<div class="field"><label>${esc(input.label)}${input.required ? ' <span class="req">*</span>' : ''}</label><textarea id="cdInput" maxlength="500" placeholder="${esc(input.placeholder || '')}"></textarea>${input.min ? `<span class="help">Mínimo ${input.min} caracteres.</span>` : ''}</div>` : ''}`,
      footer: `<button class="btn" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cdOk">${esc(confirmText)}</button>`
    });
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    new MutationObserver((_, o) => { if (!m.el.isConnected) { o.disconnect(); finish(false); } }).observe($('#modalRoot'), { childList: true });
    $('#cdOk', m.el).onclick = () => {
      if (input) {
        const v = $('#cdInput', m.el).value.trim();
        if (input.required && v.length < (input.min || 1)) { toast(`Escriba ${input.min ? 'al menos ' + input.min + ' caracteres' : 'un texto'} en "${input.label}".`, 'warn'); return; }
        finish(v); m.close(); return;
      }
      finish(true); m.close();
    };
  });

const emptyHTML = (t = 'No hay resultados para mostrar.', ic = 'inbox') => `<div class="empty"><i data-lucide="${ic}"></i><p>${esc(t)}</p></div>`;
const errorHTML = (e) => `<div class="error-box"><i data-lucide="alert-triangle"></i><p>${esc(errMsg(e))}</p></div>`;

function estadoBadge(e, anulado) {
  if (anulado) return '<span class="badge b-anulado">Anulado</span>';
  const c = { 'Pendiente': 'b-pendiente', 'En preparación': 'b-preparacion', 'Despachado': 'b-despachado', 'Entregado': 'b-entregado' }[e] || '';
  return `<span class="badge ${c}">${esc(e)}</span>`;
}
const prioBadge = (p) => `<span class="badge b-${esc(p)}">${esc((p || '').charAt(0).toUpperCase() + (p || '').slice(1))}</span>`;
const rutaEstadoBadge = (e) => `<span class="badge ${{ planificada: 'b-pendiente', activa: 'b-despachado', finalizada: 'b-entregado', cancelada: 'b-anulado' }[e] || ''}">${esc(e)}</span>`;

function options(list, val, { empty = null, key = (x) => x, label = (x) => x } = {}) {
  return (empty !== null ? `<option value="">${esc(empty)}</option>` : '') +
    list.map((x) => `<option value="${esc(key(x))}" ${String(key(x)) === String(val ?? '') ? 'selected' : ''}>${esc(label(x))}</option>`).join('');
}
const userOptions = (val, empty = 'Sin asignar', filtro = null) =>
  options(S.usuarios.filter((u) => !filtro || filtro.includes(u.rol) || u.usuario_id === val), val, { empty, key: (u) => u.usuario_id, label: (u) => `${u.nombre} (${u.rol})` });

async function loadRutas(force) {
  if (!S.rutas || force) S.rutas = await api('rutas.list', {});
  return S.rutas;
}
async function loadProductos(force) {
  if (!S.productos || force) S.productos = await api('productos.list', { soloActivos: false });
  return S.productos;
}
const rutaOptions = (val, empty = 'Sin ruta', soloAbiertas = true) =>
  options((S.rutas || []).filter((r) => !soloAbiertas || ['planificada', 'activa'].includes(r.estado) || r.ruta_id === val), val,
    { empty, key: (r) => r.ruta_id, label: (r) => `${r.codigo_ruta} · ${r.nombre_ruta} (${fD(r.fecha_operacion)}, ${r.estado})` });

/** Tabla genérica. cols: [{key,label,render?,cls?,sort?}] */
function tableHTML(cols, rows, { sort = null, rowAttr = () => '', cards = true } = {}) {
  if (!rows.length) return emptyHTML();
  const th = cols.map((c) => {
    const ind = sort && sort.by === c.sort ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<th class="${c.sort ? 'sortable' : ''} ${c.cls || ''}" ${c.sort ? `data-sort="${c.sort}"` : ''}>${esc(c.label)}${ind}</th>`;
  }).join('');
  const tr = rows.map((r) => `<tr ${rowAttr(r)}>${cols.map((c) => `<td class="${c.cls || ''}" data-label="${esc(c.label)}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('')}</tr>`).join('');
  return `<div class="table-wrap"><table class="t ${cards ? 'cards' : ''}"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}

function pagerHTML(res) {
  return `<div class="pager"><span>${res.total} registro(s) · Página ${res.page} de ${res.pages}</span>
    <div class="btns"><button class="btn sm" data-page="${res.page - 1}" ${res.page <= 1 ? 'disabled' : ''}><i data-lucide="chevron-left"></i>Anterior</button>
    <button class="btn sm" data-page="${res.page + 1}" ${res.page >= res.pages ? 'disabled' : ''}>Siguiente<i data-lucide="chevron-right"></i></button></div></div>`;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function showFatal(err) {
  $('#app').classList.add('hidden');
  const b = $('#boot');
  b.classList.remove('hidden');
  b.innerHTML = `<div class="access-denied"><h2>Acceso no disponible</h2><p>${esc(errMsg(err))}</p>
    <p class="help">Si cree que es un error, contacte al administrador del sistema.</p></div>`;
}

async function loadDashboard(silent) {
  try {
    const d = await api('dashboard.get', S.dash);
    if (S.view !== 'dashboard') return;
    const k = d.kpis;
    const kpi = (ic, cls, val, lbl) => `<div class="kpi"><div class="ico ${cls}"><i data-lucide="${ic}"></i></div><div><div class="val">${fNum(val)}</div><div class="lbl">${lbl}</div></div></div>`;
    $('#kpis').innerHTML = kpi('package', '', k.total, 'Pedidos registrados') + kpi('clock', 'info', k.pendientes, 'Pendientes') +
      kpi('clipboard-list', 'warn', k.preparacion, 'En preparación') + kpi('truck', '', k.despachados, 'Despachados') +
      kpi('check-circle', 'ok', k.entregados, 'Entregados') + kpi('alert-triangle', 'err', k.retrasados, 'Con retraso') +
      kpi('plus-circle', 'info', k.creadosHoy, 'Creados hoy') + kpi('package-check', 'ok', k.entregadosHoy, 'Entregados hoy');
    $('#dashInfo').textContent = `${d.periodo.label} · Actualizado ${fDT(d.generado)}`;
    renderDashCharts(d);

    if (!silent) { $('#kpis').innerHTML = errorHTML(e); toast(errMsg(e), 'error'); }

function chart(id, cfg) {
  if (S.charts[id]) S.charts[id].destroy();
  const c = document.getElementById(id);
  if (!c || !window.Chart) return;
  S.charts[id] = new Chart(c, cfg);
}
const C = { primary: '#4F46E5', ok: '#16A34A', warn: '#D97706', err: '#DC2626', slate: '#94A3B8', info: '#0284C7' };
const baseOpts = (extra = {}) => Object.assign({ responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { family: 'Inter' } } } } }, extra);

function renderDashCharts(d) {
  if (!window.Chart) { $$('.chart-box').forEach((b) => { b.innerHTML = emptyHTML('No fue posible cargar la librería de gráficos.'); }); return; }
  Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
  Chart.defaults.color = '#475569';
  const labels = d.evolucion.dias.map(fD);
  chart('chEstado', { type: 'doughnut', data: { labels: d.porEstado.map((x) => x.estado), datasets: [{ data: d.porEstado.map((x) => x.total), backgroundColor: [C.slate, C.warn, C.primary, C.ok] }] }, options: baseOpts() });
  chart('chEvol', { type: 'line', data: { labels, datasets: [{ label: 'Pedidos creados', data: d.evolucion.creados, borderColor: C.primary, backgroundColor: 'rgba(79,70,229,.12)', fill: true, tension: .3 }] }, options: baseOpts({ scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }) });
  chart('chDesp', { type: 'bar', data: { labels, datasets: [{ label: 'Despachados', data: d.evolucion.despachados, backgroundColor: C.primary }, { label: 'Entregados', data: d.evolucion.entregados, backgroundColor: C.ok }] }, options: baseOpts({ scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }) });
  chart('chRutas', { type: 'bar', data: { labels: d.rutas.map((r) => r.nombre), datasets: [{ label: 'Asignados', data: d.rutas.map((r) => r.total), backgroundColor: C.slate }, { label: 'Entregados', data: d.rutas.map((r) => r.entregados), backgroundColor: C.primary }, { label: 'A tiempo', data: d.rutas.map((r) => r.aTiempo), backgroundColor: C.ok }] }, options: baseOpts({ indexAxis: 'y', scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } }) });
  chart('chResp', { type: 'bar', data: { labels: d.responsables.map((r) => r.nombre), datasets: [{ label: 'Pedidos', data: d.responsables.map((r) => r.total), backgroundColor: C.info }] }, options: baseOpts({ plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }) });
}

function renderAlertas(alertas) {
  const total = alertas.reduce((a, g) => a + g.total, 0);
  if (!total) { $('#alertas').innerHTML = emptyHTML('No hay alertas operativas en este momento.', 'check-circle'); return; }
  const ic = { warning: 'alert-triangle', error: 'alert-octagon', info: 'info' };
  $('#alertas').innerHTML = alertas.filter((g) => g.total).map((g) => `
    <details class="alert-group l-${g.nivel}"><summary><i data-lucide="${ic[g.nivel]}"></i>${esc(g.titulo)}<span class="badge count">${g.total}</span></summary>
      <div class="alert-list">${g.items.map((i) => `<div class="alert-item"><a href="#" data-pedido="${esc(i.pedido_id)}">${esc(i.numero_pedido)}</a>
        <span>${esc(i.cliente_nombre)}</span>${prioBadge(i.prioridad)}<span class="muted">${esc(i.detalle)}</span></div>`).join('')}
        ${g.total > g.items.length ? `<p class="help">Se muestran ${g.items.length} de ${g.total}.</p>` : ''}</div></details>`).join('');
  $('#alertas').onclick = (e) => { const a = e.target.closest('[data-pedido]'); if (a) { e.preventDefault(); openPedido(a.dataset.pedido); } };
}

  <script>
'use strict';
/* =====================================================================
 * ViewsPedidos.html — Listado, formulario, detalle/seguimiento e impresión de pedidos.

  const q = S.pq;

        <div class="field"><label>Prioridad</label><select name="prioridad">${options(S.cat.prioridades, q.prioridad, { empty: 'Todas' })}</select></div>
        <div class="field"><label>Creado desde</label><input type="date" name="desde" value="${esc(q.desde || '')}"></div>
        <div class="field"><label>Creado hasta</label><input type="date" name="hasta" value="${esc(q.hasta || '')}"></div>
        <div class="field"><label>Ruta</label><select name="ruta_id" id="fRuta"><option value="">Todas</option></select></div>
        <div class="field"><label>Responsable</label><select name="responsable_id">${options([{ usuario_id: '__none', nombre: 'Sin responsable' }].concat(S.usuarios), q.responsable_id, { empty: 'Todos', key: (u) => u.usuario_id, label: (u) => u.nombre })}</select></div>
        <label class="check"><input type="checkbox" name="retrasados" ${q.retrasados ? 'checked' : ''}> Solo retrasados</label>
        <label class="check"><input type="checkbox" name="incluirAnulados" ${q.incluirAnulados ? 'checked' : ''}> Incluir anulados</label>

      { label: 'Dirección / zona', sort: 'zona', render: (r) => `${esc(r.direccion_entrega)}<br><span class="muted">${esc(r.zona)}, ${esc(r.ciudad)}</span>` },
      { label: 'Ref. / unid.', sort: 'unidades', cls: 'num', render: (r) => `${r.referencias} / ${fNum(r.unidades)}` },
