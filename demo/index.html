      { label: 'Ruta', sort: 'ruta_nombre', render: (r) => r.ruta_nombre ? esc(r.ruta_nombre) : '<span class="muted">Sin ruta</span>' },
      { label: 'Responsable', sort: 'responsable_nombre', render: (r) => r.responsable_nombre ? esc(r.responsable_nombre) : '<span class="muted">Sin asignar</span>' },
      { label: 'Entrega est.', sort: 'fecha_estimada_entrega', cls: 'nowrap', render: (r) => fD(r.fecha_estimada_entrega) },
      { label: 'Actualizado', sort: 'fecha_actualizacion', cls: 'nowrap', render: (r) => fDT(r.fecha_actualizacion) },
      { label: '', cls: 'actions', render: (r) => `<div class="actions"><button class="icon-btn" title="Ver detalle" data-act="view" data-id="${esc(r.pedido_id)}"><i data-lucide="eye"></i></button>
        ${can('pedidos.editar') && !r.anulado && r.estado !== 'Entregado' ? `<button class="icon-btn" title="Editar" data-act="edit" data-id="${esc(r.pedido_id)}"><i data-lucide="pencil"></i></button>` : ''}</div>` }
    ];
    box.innerHTML = res.total
      ? tableHTML(cols, res.items, { sort: { by: S.pq.sortBy, dir: S.pq.sortDir }, rowAttr: (r) => `class="clickable ${r.anulado ? 'muted' : ''}" data-id="${esc(r.pedido_id)}"` }) + pagerHTML(res)
      : emptyHTML('No se encontraron pedidos con los filtros aplicados.', 'search-x');
  } catch (e) {
    box.innerHTML = errorHTML(e);
  } finally { box.style.opacity = ''; icons(); }
}

/* ---------- Formulario de creación / edición ---------- */
async function openPedidoForm(id) {
  const m = openModal({ title: id ? 'Editar pedido' : 'Nuevo pedido', size: 'lg', body: loadingHTML() });
  let det = null;
  try {
    const tasks = [loadProductos()];
    if (can('rutas.asignar')) tasks.push(loadRutas(true));
    if (id) tasks.push(api('pedidos.get', { pedido_id: id }).then((d) => { det = d; }));
    await Promise.all(tasks);
  } catch (e) { m.body.innerHTML = errorHTML(e); icons(); return; }
  if (!m.el.isConnected) return;
  const p = det ? det.pedido : { prioridad: 'normal', fecha_estimada_entrega: '', estado: 'Pendiente' };
  const editables = det ? det.editables : null;
  if (det && !editables.length) { m.body.innerHTML = emptyHTML('El estado actual del pedido no permite modificarlo.', 'lock'); icons(); return; }
  const lineasEditables = det ? det.lineasEditables : true;
  const dis = (k) => (editables && !editables.includes(k)) ? 'disabled' : '';
  let lineas = det ? det.detalles.map((d) => ({ producto_id: d.producto_id, nombre: d.nombre_producto, sku: d.sku, cantidad: d.cantidad, precio_unitario: d.precio_unitario, observaciones: d.observaciones }))
    : [{ producto_id: '', cantidad: 1, precio_unitario: '', observaciones: '' }];
  const lineasOrig = JSON.stringify(lineas.map((l) => [l.producto_id, Number(l.cantidad), l.precio_unitario === '' ? '' : Number(l.precio_unitario), l.observaciones || '']));
  const prodActivos = S.productos.filter((x) => x.activo === 'SI');
  const puedeRuta = can('rutas.asignar') && (!det || ['Pendiente', 'En preparación'].includes(p.estado));

  m.body.innerHTML = `
    <form id="pf" autocomplete="off" novalidate>
      ${det ? `<div class="notice info"><i data-lucide="info"></i><div>Pedido <b>${esc(p.numero_pedido)}</b> · creado el ${fDT(p.fecha_creacion)} · estado ${estadoBadge(p.estado)}</div></div>`
            : `<div class="notice info"><i data-lucide="info"></i><div>El número de pedido y la fecha de creación se asignan automáticamente. Todo pedido nuevo inicia en estado <b>Pendiente</b>.</div></div>`}
      <div class="form-section">Cliente</div>
      <div class="form-grid">
        <div class="field span-2"><label>Nombre o razón social <span class="req">*</span></label><input name="cliente_nombre" maxlength="150" required value="${esc(p.cliente_nombre)}" ${dis('cliente_nombre')}></div>
        <div class="field"><label>Documento / NIT</label><input name="cliente_documento" maxlength="30" value="${esc(p.cliente_documento)}" ${dis('cliente_documento')}></div>
        <div class="field"><label>Teléfono <span class="req">*</span></label><input name="cliente_telefono" maxlength="30" required value="${esc(p.cliente_telefono)}" ${dis('cliente_telefono')}></div>
        <div class="field span-2"><label>Correo electrónico</label><input type="email" name="cliente_correo" maxlength="120" value="${esc(p.cliente_correo)}" ${dis('cliente_correo')}></div>
      </div>
      <div class="form-section">Entrega</div>
      <div class="form-grid">
        <div class="field span-3"><label>Dirección de entrega <span class="req">*</span></label><input name="direccion_entrega" maxlength="250" required value="${esc(p.direccion_entrega)}" ${dis('direccion_entrega')}></div>
        <div class="field"><label>Ciudad o municipio <span class="req">*</span></label><input name="ciudad" maxlength="80" required value="${esc(p.ciudad)}" ${dis('ciudad')}></div>
        <div class="field"><label>Barrio o zona <span class="req">*</span></label><input name="zona" maxlength="80" required value="${esc(p.zona)}" ${dis('zona')}></div>
        <div class="field"><label>Fecha estimada de entrega <span class="req">*</span></label><input type="date" name="fecha_estimada_entrega" required min="${det ? '' : todayBog()}" value="${esc(p.fecha_estimada_entrega)}" ${dis('fecha_estimada_entrega')}></div>
        <div class="field"><label>Prioridad</label><select name="prioridad" ${dis('prioridad')}>${options(S.cat.prioridades, p.prioridad, { label: (x) => x.charAt(0).toUpperCase() + x.slice(1) })}</select></div>
        <div class="field"><label>Responsable asignado</label><select name="responsable_id" ${dis('responsable_id')}>${userOptions(p.responsable_id)}</select></div>
        <div class="field"><label>Ruta asignada</label><select name="ruta_id" ${puedeRuta ? '' : 'disabled'}>${rutaOptions(p.ruta_id)}</select>
          ${puedeRuta ? '' : `<span class="help">${can('rutas.asignar') ? 'No se puede cambiar en el estado actual.' : 'La asigna un despachador o administrador.'}</span>`}</div>
        <div class="field span-3"><label>Observaciones</label><textarea name="observaciones" maxlength="1000" ${dis('observaciones')}>${esc(p.observaciones)}</textarea></div>
        <div class="field span-3"><label>Observaciones internas (logística)</label><textarea name="observaciones_internas" maxlength="1000" ${dis('observaciones_internas')}>${esc(p.observaciones_internas)}</textarea></div>
      </div>
      <div class="form-section">Productos solicitados</div>
      ${lineasEditables ? '' : '<div class="notice warn"><i data-lucide="lock"></i><div>Los productos solo se pueden modificar mientras el pedido está Pendiente.</div></div>'}
      <div id="lineas"></div>
      ${lineasEditables ? '<button type="button" class="btn sm" id="addLinea"><i data-lucide="plus"></i>Agregar producto</button>' : ''}
      ${prodActivos.length ? '' : '<div class="notice err"><i data-lucide="alert-circle"></i><div>No hay productos activos en el catálogo. Un administrador debe registrarlos primero.</div></div>'}
      ${det ? '<div class="field" style="margin-top:12px"><label>Motivo del cambio (opcional, queda en el historial)</label><input name="motivo" maxlength="500"></div>' : ''}
    </form>`;
  const foot = document.createElement('div');
  foot.className = 'modal-foot';
  foot.innerHTML = `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="pfSave"><i data-lucide="save"></i>${det ? 'Guardar cambios' : 'Registrar pedido'}</button>`;
  m.el.querySelector('.modal').appendChild(foot);

  const renderLineas = () => {
    const ro = !lineasEditables;
    const total = lineas.reduce((a, l) => a + (l.precio_unitario !== '' && l.precio_unitario !== null ? Number(l.precio_unitario) * Number(l.cantidad || 0) : 0), 0);
    const hayPrecio = lineas.some((l) => l.precio_unitario !== '' && l.precio_unitario !== null);
    $('#lineas', m.el).innerHTML = `<div class="table-wrap"><table class="t cards"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio unit. (opcional)</th><th class="num">Subtotal</th><th>Observación</th><th></th></tr></thead><tbody>
      ${lineas.map((l, i) => `<tr data-i="${i}">
        <td data-label="Producto">${ro ? esc(`${l.sku} · ${l.nombre}`) : `<select data-f="producto_id"><option value="">Seleccione…</option>${options(prodActivos.concat(prodActivos.some((x) => x.producto_id === l.producto_id) || !l.producto_id ? [] : [{ producto_id: l.producto_id, sku: l.sku, nombre: l.nombre + ' (inactivo)', unidad_medida: '' }]), l.producto_id, { key: (x) => x.producto_id, label: (x) => `${x.sku} · ${x.nombre}${x.unidad_medida ? ' (' + x.unidad_medida + ')' : ''}` })}</select>`}</td>
        <td data-label="Cantidad"><input type="number" min="0.01" step="0.01" data-f="cantidad" value="${esc(l.cantidad)}" ${ro ? 'disabled' : ''} style="max-width:110px"></td>
        <td data-label="Precio unit."><input type="number" min="0" step="1" data-f="precio_unitario" value="${esc(l.precio_unitario)}" ${ro ? 'disabled' : ''} style="max-width:140px"></td>
        <td class="num" data-label="Subtotal">${l.precio_unitario !== '' && l.precio_unitario !== null ? fCOP(Number(l.precio_unitario) * Number(l.cantidad || 0)) : '—'}</td>
        <td data-label="Observación"><input data-f="observaciones" maxlength="300" value="${esc(l.observaciones)}" ${ro ? 'disabled' : ''}></td>
        <td class="actions">${ro ? '' : `<button type="button" class="icon-btn" data-del="${i}" title="Eliminar línea"><i data-lucide="trash-2"></i></button>`}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="lines-total">${lineas.length} línea(s) · ${fNum(lineas.reduce((a, l) => a + Number(l.cantidad || 0), 0))} unidades${hayPrecio ? ' · Total ' + fCOP(total) : ''}</div>`;
    icons();
  };
  renderLineas();
  const lbox = $('#lineas', m.el);
  lbox.addEventListener('change', (e) => {
    const tr = e.target.closest('tr[data-i]'); if (!tr) return;
    const l = lineas[Number(tr.dataset.i)]; const f = e.target.dataset.f;
    l[f] = e.target.value;
    if (f === 'producto_id') {
      const pr = S.productos.find((x) => x.producto_id === l.producto_id);
      if (pr) { l.sku = pr.sku; l.nombre = pr.nombre; if (l.precio_unitario === '' && pr.precio_referencia !== '') l.precio_unitario = pr.precio_referencia; }
    }
    renderLineas();
  });
  lbox.addEventListener('click', (e) => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    if (lineas.length === 1) return toast('El pedido debe tener al menos un producto.', 'warn');
    lineas.splice(Number(b.dataset.del), 1); renderLineas();
  });
  const add = $('#addLinea', m.el);
  if (add) add.onclick = () => { lineas.push({ producto_id: '', cantidad: 1, precio_unitario: '', observaciones: '' }); renderLineas(); };

  $('#pfSave', m.el).onclick = async (ev) => {
    const form = $('#pf', m.el);
    const fd = new FormData(form);
    const data = {};
    ['cliente_nombre', 'cliente_documento', 'cliente_telefono', 'cliente_correo', 'direccion_entrega', 'ciudad', 'zona', 'fecha_estimada_entrega',
      'prioridad', 'responsable_id', 'observaciones', 'observaciones_internas'].forEach((k) => { data[k] = form.elements[k].value.trim(); });
    // Validación en el cliente (el servidor vuelve a validar todo).
    const req = [['cliente_nombre', 'Cliente'], ['cliente_telefono', 'Teléfono'], ['direccion_entrega', 'Dirección'], ['ciudad', 'Ciudad'], ['zona', 'Barrio o zona'], ['fecha_estimada_entrega', 'Fecha estimada de entrega']];
    const falta = req.find(([k]) => !data[k]);
    if (falta) { toast(`El campo "${falta[1]}" es obligatorio.`, 'warn'); form.elements[falta[0]].focus(); return; }
    if (data.cliente_correo && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.cliente_correo)) return toast('El correo electrónico no es válido.', 'warn');
    if (!det && data.fecha_estimada_entrega < todayBog()) return toast('La fecha estimada de entrega no puede ser anterior a hoy.', 'warn');
    if (lineasEditables) {
      for (let i = 0; i < lineas.length; i++) {
        const l = lineas[i];
        if (!l.producto_id) return toast(`Seleccione el producto de la línea ${i + 1}.`, 'warn');
        if (!(Number(l.cantidad) > 0)) return toast(`La cantidad de la línea ${i + 1} debe ser mayor que cero.`, 'warn');
        if (l.precio_unitario !== '' && l.precio_unitario !== null && !(Number(l.precio_unitario) >= 0)) return toast(`El precio de la línea ${i + 1} no es válido.`, 'warn');
      }
    }
    const lineasPayload = lineas.map((l) => ({ producto_id: l.producto_id, cantidad: l.cantidad, precio_unitario: l.precio_unitario, observaciones: l.observaciones }));
    const lineasNow = JSON.stringify(lineas.map((l) => [l.producto_id, Number(l.cantidad), l.precio_unitario === '' || l.precio_unitario === null ? '' : Number(l.precio_unitario), l.observaciones || '']));
    if (puedeRuta) data.ruta_id = form.elements.ruta_id.value;
    let r;
    if (det) {
      Object.assign(data, { pedido_id: det.pedido.pedido_id, version: det.pedido.version, motivo: fd.get('motivo') || '' });
      if (lineasEditables && lineasNow !== lineasOrig) { data.lineasModificadas = true; data.lineas = lineasPayload; }
      r = await run('pedidos.update', data, ev.currentTarget);
      if (r) toast(r.sinCambios ? 'No había cambios para guardar.' : 'Pedido actualizado.', 'ok');
    } else {
      data.lineas = lineasPayload;
      r = await run('pedidos.create', data, ev.currentTarget);
      if (r) toast(`Pedido ${r.numero_pedido} registrado.`, 'ok');
    }
    if (r) { m.close(); refreshCurrent(); if (!det) openPedido(r.pedido_id); }
  };
  icons();
}

function refreshCurrent() {
  if (S.view === 'pedidos') loadPedidos();
  else if (S.view === 'dashboard') loadDashboard(true);
  else if (VIEWS[S.view] && ['preparacion', 'despacho', 'rutas'].includes(S.view)) VIEWS[S.view]();
}

/* ---------- Detalle y seguimiento ---------- */
const ACCIONES = {
  CREAR: 'Pedido registrado', EDITAR: 'Información modificada', DUPLICAR: 'Pedido creado por duplicación', ASIGNAR_RUTA: 'Ruta asignada', RETIRAR_RUTA: 'Retirado de la ruta',
  INICIAR_PREPARACION: 'Preparación iniciada', REGISTRAR_ALISTAMIENTO: 'Avance de alistamiento', FINALIZAR_PREPARACION: 'Preparación finalizada',
  DESPACHAR: 'Pedido despachado', ENTREGAR: 'Entrega registrada', ANULAR: 'Pedido anulado', EXCEPCION_DESPACHO: 'Excepción: despacho sin preparación completa',
  EXCEPCION_REVERSION: 'Excepción: reversión de estado', ELIMINAR: 'Pedido eliminado', CAMBIAR_ESTADO: 'Cambio de estado', CREAR_RUTA: 'Ruta creada'
};
const HITOS = [['CREAR', 'Pedido registrado'], ['INICIAR_PREPARACION', 'Preparación iniciada'], ['FINALIZAR_PREPARACION', 'Preparación finalizada'], ['DESPACHAR', 'Pedido despachado'], ['ENTREGAR', 'Entrega registrada']];

async function openPedido(id) {
  const m = openModal({ title: 'Detalle del pedido', size: 'lg', body: loadingHTML() });
  let d;
  try { d = await api('pedidos.get', { pedido_id: id }); } catch (e) { m.body.innerHTML = errorHTML(e); icons(); return; }
  if (!m.el.isConnected) return;
  renderPedidoDetalle(m, d);
}

function renderPedidoDetalle(m, d) {
  const p = d.pedido, r = d.resumen;
  m.el.querySelector('.modal-head h2').textContent = `Pedido ${p.numero_pedido}`;
  const totalLineas = d.detalles.reduce((a, x) => a + (x.subtotal !== '' ? Number(x.subtotal) : 0), 0);
  const hayPrecio = d.detalles.some((x) => x.subtotal !== '');
  // Hitos: se toma el último evento de cada tipo (una reversión puede repetirlos).
  const ultimo = (acc) => d.historial.filter((h) => h.accion === acc).pop();
  const timeline = HITOS.map(([acc, lbl]) => {
    const h = ultimo(acc);
    return `<li class="${h ? 'done' : ''}"><div class="t-title">${lbl}</div><div class="t-meta">${h ? `${fDT(h.fecha_evento)} · ${esc(h.usuario)}${h.observacion ? ' · ' + esc(h.observacion) : ''}` : 'Pendiente'}</div></li>`;
  }).join('');
  const log = d.historial.slice().reverse().map((h) => `<li class="${h.accion.startsWith('EXCEPCION') || h.accion === 'ANULAR' ? 'exc' : 'done'}">
    <div class="t-title">${esc(ACCIONES[h.accion] || h.accion)}</div>
    <div class="t-meta">${fDT(h.fecha_evento)} · ${esc(h.usuario)}</div>
    ${h.valor_anterior || h.valor_nuevo ? `<div class="t-meta">${h.valor_anterior ? esc(h.valor_anterior) + ' → ' : ''}${esc(h.valor_nuevo)}</div>` : ''}
    ${h.observacion ? `<div class="t-meta"><i>${esc(h.observacion)}</i></div>` : ''}</li>`).join('');

  m.body.innerHTML = `
    ${p.anulado === 'SI' ? `<div class="notice err"><i data-lucide="ban"></i><div><b>Pedido anulado.</b> ${esc(p.motivo_anulacion)}</div></div>` : ''}
    ${r.retrasado ? '<div class="notice warn"><i data-lucide="alert-triangle"></i><div>El pedido está <b>retrasado</b>: la fecha estimada de entrega ya pasó.</div></div>' : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${estadoBadge(p.estado, p.anulado === 'SI')} ${prioBadge(p.prioridad)}
      ${r.preparado ? '<span class="badge b-ok">Preparación completa</span>' : ''}${r.es_demo ? '<span class="badge b-demo">DEMO</span>' : ''}</div>
    <div class="tabs" id="pdTabs"><button class="active" data-t="info">Información</button><button data-t="prod">Productos (${d.detalles.length})</button><button data-t="seg">Seguimiento</button><button data-t="hist">Historial (${d.historial.length})</button></div>
    <div data-pane="info"><div class="dl">
      <div><span>Cliente</span><b>${esc(p.cliente_nombre)}</b></div><div><span>Documento</span><b>${esc(p.cliente_documento) || '—'}</b></div>
      <div><span>Teléfono</span><b>${esc(p.cliente_telefono)}</b></div><div><span>Correo</span><b>${esc(p.cliente_correo) || '—'}</b></div>
      <div><span>Dirección</span><b>${esc(p.direccion_entrega)}</b></div><div><span>Ciudad / zona</span><b>${esc(p.ciudad)} · ${esc(p.zona)}</b></div>
      <div><span>Creación</span><b>${fDT(p.fecha_creacion)}</b></div><div><span>Entrega estimada</span><b>${fD(p.fecha_estimada_entrega)}</b></div>
      <div><span>Responsable</span><b>${d.responsable ? esc(d.responsable.nombre) : '—'}</b></div>
      <div><span>Ruta</span><b>${d.ruta ? esc(d.ruta.codigo_ruta + ' · ' + d.ruta.nombre_ruta) + ' ' + rutaEstadoBadge(d.ruta.estado) : '—'}</b></div>
      <div><span>Preparó</span><b>${d.preparador ? esc(d.preparador.nombre) : '—'}</b></div>
      <div><span>Despacho</span><b>${fDT(p.fecha_despacho) || '—'}</b></div>
      <div><span>Entrega real</span><b>${fDT(p.fecha_entrega) || '—'}</b></div><div><span>Recibió</span><b>${esc(p.recibido_por) || '—'}</b></div>
      <div><span>Última actualización</span><b>${fDT(p.fecha_actualizacion)} · ${esc(p.actualizado_por)}</b></div>
      <div style="grid-column:1/-1"><span>Observaciones</span><b>${esc(p.observaciones) || '—'}</b></div>
      <div style="grid-column:1/-1"><span>Observaciones internas</span><b>${esc(p.observaciones_internas) || '—'}</b></div>
      ${p.observacion_entrega ? `<div style="grid-column:1/-1"><span>Observación del repartidor</span><b>${esc(p.observacion_entrega)}</b></div>` : ''}
    </div></div>
    <div data-pane="prod" class="hidden">${tableHTML([
      { label: 'SKU', key: 'sku' }, { label: 'Producto', key: 'nombre_producto' },
      { label: 'Cantidad', cls: 'num', render: (x) => fNum(x.cantidad) }, { label: 'Preparado', cls: 'num', render: (x) => fNum(x.cantidad_preparada) },
      { label: 'Precio unit.', cls: 'num', render: (x) => x.precio_unitario !== '' ? fCOP(x.precio_unitario) : '—' },
      { label: 'Subtotal', cls: 'num', render: (x) => x.subtotal !== '' ? fCOP(x.subtotal) : '—' }, { label: 'Observación', key: 'observaciones' }], d.detalles)}
      <div class="lines-total">${fNum(r.unidades)} unidades${hayPrecio ? ' · Total ' + fCOP(totalLineas) : ''}</div>
      ${hayPrecio ? '<p class="help">Los valores corresponden al precio comercial registrado; no representan el costo logístico.</p>' : ''}</div>
    <div data-pane="seg" class="hidden"><ul class="timeline">${timeline}</ul></div>
    <div data-pane="hist" class="hidden">${d.historial.length ? `<ul class="timeline">${log}</ul>` : emptyHTML('Sin eventos registrados.')}</div>`;

  $('#pdTabs', m.el).onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    $$('#pdTabs button', m.el).forEach((x) => x.classList.toggle('active', x === b));
    $$('[data-pane]', m.el).forEach((x) => x.classList.toggle('hidden', x.dataset.pane !== b.dataset.t));
  };

  // Acciones según estado y permisos (el servidor vuelve a validarlas).
  const activo = p.anulado !== 'SI';
  const btns = [];
  btns.push(`<button class="btn" data-a="print"><i data-lucide="printer"></i>Orden de preparación</button>`);
  if (d.editables.length) btns.push(`<button class="btn" data-a="edit"><i data-lucide="pencil"></i>Editar</button>`);
  if (can('pedidos.duplicar')) btns.push(`<button class="btn" data-a="dup"><i data-lucide="copy"></i>Duplicar</button>`);
  if (activo && can('preparacion.gestionar') && p.estado === 'Pendiente') btns.push(`<button class="btn warn" data-a="iniciar"><i data-lucide="play"></i>Iniciar preparación</button>`);
  if (activo && can('preparacion.gestionar') && p.estado === 'En preparación' && !p.fecha_fin_preparacion) btns.push(`<button class="btn warn" data-a="alistar"><i data-lucide="clipboard-check"></i>Registrar alistamiento</button>`);
  if (activo && can('despacho.gestionar') && p.estado === 'En preparación') btns.push(`<button class="btn primary" data-a="despachar"><i data-lucide="truck"></i>Despachar</button>`);
  if (activo && can('entrega.registrar') && p.estado === 'Despachado') btns.push(`<button class="btn success" data-a="entregar"><i data-lucide="package-check"></i>Registrar entrega</button>`);
  if (activo && can('excepciones.autorizar') && p.estado !== 'Pendiente') btns.push(`<button class="btn" data-a="revertir"><i data-lucide="undo-2"></i>Revertir estado</button>`);
  if (activo && can('pedidos.anular') && p.estado !== 'Entregado') btns.push(`<button class="btn danger" data-a="anular"><i data-lucide="ban"></i>Anular</button>`);
  if (activo && can('pedidos.eliminar') && p.estado === 'Pendiente' && !p.ruta_id && !p.fecha_inicio_preparacion) btns.push(`<button class="btn danger" data-a="eliminar"><i data-lucide="trash-2"></i>Eliminar</button>`);
  let foot = m.el.querySelector('.modal-foot');
  if (!foot) { foot = document.createElement('div'); foot.className = 'modal-foot'; m.el.querySelector('.modal').appendChild(foot); }
  foot.innerHTML = btns.join('');
  const reload = async () => {
    refreshCurrent();
    try { const nd = await api('pedidos.get', { pedido_id: p.pedido_id }); if (m.el.isConnected) renderPedidoDetalle(m, nd); } catch (e) { toast(errMsg(e), 'error'); }
  };
  foot.onclick = async (e) => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'print') return printOrden(d);
    if (a === 'edit') { m.close(); return openPedidoForm(p.pedido_id); }
    if (a === 'dup') {
      if (!await confirmDialog({ title: 'Duplicar pedido', message: `Se creará un nuevo pedido <b>Pendiente</b> con el mismo cliente y productos de ${esc(p.numero_pedido)}, sin ruta asignada.`, confirmText: 'Duplicar' })) return;
      const r = await run('pedidos.duplicate', { pedido_id: p.pedido_id }, b, 'Pedido duplicado.');
      if (r) { m.close(); refreshCurrent(); openPedido(r.pedido_id); }
      return;
    }
    if (a === 'iniciar') { if (await iniciarPreparacion(p, b)) reload(); return; }
    if (a === 'alistar') return openAlistamiento(p.pedido_id, reload);
    if (a === 'despachar') return openDespacho(p.pedido_id, reload);
    if (a === 'entregar') return openEntrega(p, reload);
    if (a === 'revertir') {
      const prev = { 'En preparación': 'Pendiente', 'Despachado': 'En preparación', 'Entregado': 'Despachado' }[p.estado];
      const just = await confirmDialog({ title: 'Revertir estado (excepción)', danger: true, confirmText: 'Revertir',
        message: `El pedido pasará de <b>${esc(p.estado)}</b> a <b>${esc(prev)}</b>. Se borrarán las fechas del estado actual y la excepción quedará registrada en el historial.`,
        input: { label: 'Justificación', required: true, min: 10 } });
      if (just === false) return;
      if (await run('flujo.revertir', { pedido_id: p.pedido_id, version: p.version, justificacion: just }, b, 'Estado revertido.')) reload();
      return;
    }
    if (a === 'anular') {
      const motivo = await confirmDialog({ title: 'Anular pedido', danger: true, confirmText: 'Anular pedido',
        message: `El pedido <b>${esc(p.numero_pedido)}</b> quedará anulado: no se podrá modificar ni avanzar y dejará de contar en los indicadores. Su historial se conserva. Esta acción no se puede deshacer desde la aplicación.`,
        input: { label: 'Motivo de la anulación', required: true, min: 10 } });
      if (motivo === false) return;
      if (await run('pedidos.anular', { pedido_id: p.pedido_id, version: p.version, motivo }, b, 'Pedido anulado.')) reload();
      return;
    }
    if (a === 'eliminar') {
      const motivo = await confirmDialog({ title: 'Eliminar pedido', danger: true, confirmText: 'Eliminar definitivamente',
        message: `Se eliminará <b>definitivamente</b> el pedido ${esc(p.numero_pedido)} y sus productos. Solo queda constancia en la auditoría. Si el pedido debe conservarse, use <b>Anular</b>.`,
        input: { label: 'Motivo', required: true, min: 10 } });
      if (motivo === false) return;
      if (await run('pedidos.eliminar', { pedido_id: p.pedido_id, version: p.version, motivo }, b, 'Pedido eliminado.')) { m.close(); refreshCurrent(); }
    }
  };
  icons();
}

/* ---------- Impresión de la orden de preparación ---------- */
function printOrden(d) {
  const p = d.pedido;
  const html = `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Orden ${esc(p.numero_pedido)}</title><style>
    body{font-family:Arial,sans-serif;font-size:12px;color:#111827;margin:24px}h1{font-size:18px;margin:0;color:#4F46E5}
    table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #CBD5E1;padding:6px;text-align:left}th{background:#F1F5F9}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-top:12px}.box{width:16px;height:16px;border:1px solid #111;display:inline-block}
    .firma{margin-top:40px;display:flex;gap:40px}.firma div{flex:1;border-top:1px solid #111;padding-top:4px;text-align:center}</style></head><body>
    <h1>Orden de preparación · ${esc(p.numero_pedido)}</h1><div>${esc(S.cfg.nombre_empresa || '')} · Impresa el ${fDT(nowBogLocal())}</div>
    <div class="grid"><div><b>Cliente:</b> ${esc(p.cliente_nombre)}</div><div><b>Teléfono:</b> ${esc(p.cliente_telefono)}</div>
    <div><b>Dirección:</b> ${esc(p.direccion_entrega)}, ${esc(p.zona)}, ${esc(p.ciudad)}</div><div><b>Entrega estimada:</b> ${fD(p.fecha_estimada_entrega)}</div>
    <div><b>Prioridad:</b> ${esc(p.prioridad)}</div><div><b>Ruta:</b> ${d.ruta ? esc(d.ruta.codigo_ruta + ' · ' + d.ruta.nombre_ruta) : 'Sin ruta'}</div>
    <div><b>Responsable:</b> ${d.responsable ? esc(d.responsable.nombre) : '—'}</div><div><b>Estado:</b> ${esc(p.estado)}</div></div>
    <table><thead><tr><th>✓</th><th>SKU</th><th>Producto</th><th>Cantidad</th><th>Preparado</th><th>Observación</th></tr></thead><tbody>
    ${d.detalles.map((x) => `<tr><td><span class="box"></span></td><td>${esc(x.sku)}</td><td>${esc(x.nombre_producto)}</td><td>${fNum(x.cantidad)}</td><td></td><td>${esc(x.observaciones)}</td></tr>`).join('')}
    </tbody></table>
    ${p.observaciones ? `<p><b>Observaciones:</b> ${esc(p.observaciones)}</p>` : ''}${p.observaciones_internas ? `<p><b>Observaciones internas:</b> ${esc(p.observaciones_internas)}</p>` : ''}
    <div class="firma"><div>Preparó</div><div>Revisó</div></div></body></html>`;
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0';
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  setTimeout(() => { try { iframe.contentWindow.focus(); iframe.contentWindow.print(); } catch (e) { toast('No fue posible abrir la impresión.', 'error'); } setTimeout(() => iframe.remove(), 1000); }, 250);
}
</script>

  <script>
'use strict';
/* =====================================================================
 * ViewsOperacion.html — Preparación, despacho/entregas y rutas.
 * ===================================================================== */

async function iniciarPreparacion(p, btn) {
  if (!await confirmDialog({ title: 'Iniciar preparación', message: `El pedido <b>${esc(p.numero_pedido)}</b> pasará a <b>En preparación</b> y usted quedará como responsable del alistamiento.`, confirmText: 'Iniciar' })) return null;
  return run('flujo.iniciarPreparacion', { pedido_id: p.pedido_id, version: p.version }, btn, 'Preparación iniciada.');
}

async function openAlistamiento(id, onDone) {
  const m = openModal({ title: 'Registrar alistamiento', size: 'md', body: loadingHTML() });
  let d;
  try { d = await api('pedidos.get', { pedido_id: id }); } catch (e) { m.body.innerHTML = errorHTML(e); icons(); return; }
  if (!m.el.isConnected) return;
  const p = d.pedido;
  m.el.querySelector('.modal-head h2').textContent = `Alistamiento · ${p.numero_pedido}`;
  m.body.innerHTML = `
    <div class="dl" style="margin-bottom:12px"><div><span>Cliente</span><b>${esc(p.cliente_nombre)}</b></div>
      <div><span>Entrega estimada</span><b>${fD(p.fecha_estimada_entrega)}</b></div><div><span>Prioridad</span><b>${prioBadge(p.prioridad)}</b></div>
      ${p.observaciones ? `<div style="grid-column:1/-1"><span>Observaciones</span><b>${esc(p.observaciones)}</b></div>` : ''}
      ${p.observaciones_internas ? `<div style="grid-column:1/-1"><span>Observaciones internas</span><b>${esc(p.observaciones_internas)}</b></div>` : ''}</div>
    <div class="table-wrap"><table class="t cards"><thead><tr><th>Producto</th><th class="num">Solicitado</th><th>Preparado</th><th></th></tr></thead><tbody>
      ${d.detalles.map((x) => `<tr data-id="${esc(x.detalle_id)}"><td data-label="Producto"><b>${esc(x.sku)}</b> · ${esc(x.nombre_producto)}${x.observaciones ? `<br><span class="muted">${esc(x.observaciones)}</span>` : ''}</td>
        <td class="num" data-label="Solicitado">${fNum(x.cantidad)}</td>
        <td data-label="Preparado"><input type="number" min="0" max="${esc(x.cantidad)}" step="0.01" value="${esc(x.cantidad_preparada || 0)}" data-max="${esc(x.cantidad)}" style="max-width:110px"></td>
        <td class="actions"><button type="button" class="btn sm" data-full>Completo</button></td></tr>`).join('')}
    </tbody></table></div>
    <div class="field" style="margin-top:12px"><label>Observación del alistamiento</label><textarea id="alObs" maxlength="500"></textarea></div>
    <p class="help">Guarde el avance cuantas veces necesite. Solo puede finalizar cuando todas las cantidades estén completas.</p>`;
  const foot = document.createElement('div'); foot.className = 'modal-foot';
  foot.innerHTML = `<button class="btn" data-close>Cancelar</button><button class="btn" id="alSave"><i data-lucide="save"></i>Guardar avance</button><button class="btn success" id="alFin"><i data-lucide="check"></i>Finalizar preparación</button>`;
  m.el.querySelector('.modal').appendChild(foot);
  m.body.onclick = (e) => { const b = e.target.closest('[data-full]'); if (b) { const i = b.closest('tr').querySelector('input'); i.value = i.dataset.max; } };
  const send = async (finalizar, btn) => {
    const lineas = [];
    for (const tr of $$('tr[data-id]', m.el)) {
      const i = tr.querySelector('input'); const v = Number(i.value);
      if (i.value === '' || !(v >= 0) || v > Number(i.dataset.max)) { toast('Las cantidades preparadas deben estar entre 0 y lo solicitado.', 'warn'); i.focus(); return; }
      lineas.push({ detalle_id: tr.dataset.id, cantidad_preparada: v });
    }
    if (finalizar && lineas.some((l, k) => l.cantidad_preparada < Number(d.detalles[k].cantidad))) return toast('Hay productos con cantidades pendientes; no se puede finalizar.', 'warn');
    if (finalizar && !await confirmDialog({ title: 'Finalizar preparación', message: 'Se registrará que el pedido está completamente preparado y quedará listo para despacho.', confirmText: 'Finalizar' })) return;
    const r = await run('flujo.registrarPreparacion', { pedido_id: p.pedido_id, version: p.version, lineas, finalizar, observacion: $('#alObs', m.el).value }, btn,
      finalizar ? 'Preparación finalizada.' : 'Avance guardado.');
    if (r) { m.close(); if (onDone) onDone(); }
  };
  $('#alSave', m.el).onclick = (e) => send(false, e.currentTarget);
  $('#alFin', m.el).onclick = (e) => send(true, e.currentTarget);
  icons();
}

async function openDespacho(id, onDone) {
  const m = openModal({ title: 'Despachar pedido', size: 'md', body: loadingHTML() });
  let d;
  try { [d] = await Promise.all([api('pedidos.get', { pedido_id: id }), loadRutas(true)]); } catch (e) { m.body.innerHTML = errorHTML(e); icons(); return; }
  if (!m.el.isConnected) return;
  const p = d.pedido;
  const preparado = !!p.fecha_fin_preparacion;
  const rutaOk = d.ruta && ['planificada', 'activa'].includes(d.ruta.estado);
  m.body.innerHTML = `
    <p style="margin-top:0">Pedido <b>${esc(p.numero_pedido)}</b> · ${esc(p.cliente_nombre)} · ${esc(p.zona)}</p>
    ${preparado ? '<div class="notice info"><i data-lucide="check-circle"></i><div>Preparación completa. El pedido puede despacharse.</div></div>'
      : can('excepciones.autorizar') ? '<div class="notice warn"><i data-lucide="alert-triangle"></i><div>La preparación <b>no está finalizada</b>. Solo puede despacharse como excepción autorizada y justificada.</div></div>'
      : '<div class="notice err"><i data-lucide="lock"></i><div>La preparación no está finalizada. Un responsable de bodega debe completarla o un administrador autorizar una excepción.</div></div>'}
    <div class="field"><label>Ruta <span class="req">*</span></label><select id="dsRuta">${rutaOptions(rutaOk ? p.ruta_id : '', 'Seleccione una ruta…')}</select>
      ${d.ruta && !rutaOk ? `<span class="help">La ruta actual (${esc(d.ruta.codigo_ruta)}) está ${esc(d.ruta.estado)}; seleccione otra.</span>` : ''}</div>
    <div class="field" style="margin-top:10px"><label>Observación</label><textarea id="dsObs" maxlength="500"></textarea></div>
    ${!preparado && can('excepciones.autorizar') ? `<label class="check" style="margin-top:10px"><input type="checkbox" id="dsExc"> Autorizo despachar sin preparación completa</label>
      <div class="field" style="margin-top:8px"><label>Justificación de la excepción <span class="req">*</span></label><textarea id="dsJust" maxlength="500"></textarea></div>` : ''}`;
  const foot = document.createElement('div'); foot.className = 'modal-foot';
  foot.innerHTML = `<button class="btn" data-close>Cancelar</button>${preparado || can('excepciones.autorizar') ? '<button class="btn primary" id="dsOk"><i data-lucide="truck"></i>Confirmar despacho</button>' : ''}`;
  m.el.querySelector('.modal').appendChild(foot);
  const ok = $('#dsOk', m.el);
  if (ok) ok.onclick = async (e) => {
    const btn = e.currentTarget;
    const rutaId = $('#dsRuta', m.el).value;
    if (!rutaId) return toast('Seleccione la ruta de despacho.', 'warn');
    const payload = { pedido_id: p.pedido_id, version: p.version, observacion: $('#dsObs', m.el).value };
    if (!preparado) {
      if (!$('#dsExc', m.el).checked) return toast('Marque la autorización de la excepción.', 'warn');
      payload.excepcion = true; payload.justificacion = $('#dsJust', m.el).value.trim();
      if (payload.justificacion.length < 10) return toast('La justificación debe tener al menos 10 caracteres.', 'warn');
    }
    if (rutaId !== p.ruta_id) {
      const a = await run('rutas.asignar', { ruta_id: rutaId, pedido_ids: [p.pedido_id], versiones: { [p.pedido_id]: p.version } }, btn);
      if (!a) return;
      const v = a.asignados.find((x) => x.pedido_id === p.pedido_id);
      if (v) { payload.version = v.version; p.version = v.version; p.ruta_id = rutaId; }
    }
    if (await run('flujo.despachar', payload, btn, 'Pedido despachado.')) { m.close(); if (onDone) onDone(); }
  };
  icons();
}

function openEntrega(p, onDone) {
  const m = openModal({ title: `Registrar entrega · ${p.numero_pedido}`, body: `
    <p style="margin-top:0">${esc(p.cliente_nombre)} · ${esc(p.direccion_entrega || '')}</p>
    <div class="field"><label>Fecha y hora reales de entrega <span class="req">*</span></label><input type="datetime-local" id="enFecha" value="${nowBogLocal()}" max="${nowBogLocal()}"></div>
    <div class="field" style="margin-top:10px"><label>Persona que recibe</label><input id="enRec" maxlength="120"></div>
    <div class="field" style="margin-top:10px"><label>Observación del repartidor</label><textarea id="enObs" maxlength="500"></textarea></div>
    <label class="check" style="margin-top:12px"><input type="checkbox" id="enConf"> Confirmo que la entrega fue realizada</label>
    <p class="help">La evidencia fotográfica o firma digital no está disponible en esta versión.</p>`,
    footer: '<button class="btn" data-close>Cancelar</button><button class="btn success" id="enOk"><i data-lucide="package-check"></i>Registrar entrega</button>' });
  $('#enOk', m.el).onclick = async (e) => {
    const fecha = $('#enFecha', m.el).value;
    if (!fecha) return toast('Indique la fecha y hora de entrega.', 'warn');
    if (fecha > nowBogLocal()) return toast('La fecha de entrega no puede ser futura.', 'warn');
    if (!$('#enConf', m.el).checked) return toast('Debe confirmar que la entrega fue realizada.', 'warn');
    const r = await run('flujo.registrarEntrega', { pedido_id: p.pedido_id, version: p.version, fecha_entrega: fecha, recibido_por: $('#enRec', m.el).value,
      observacion_entrega: $('#enObs', m.el).value, confirmado: true }, e.currentTarget, 'Entrega registrada.');
    if (r) { m.close(); if (onDone) onDone(); }
  };
}

/* ---------- Listas operativas reutilizables ---------- */
function opTable(items, acciones) {
  return tableHTML([
    { label: 'Número', render: (r) => `<a href="#" data-open="${esc(r.pedido_id)}"><b>${esc(r.numero_pedido)}</b></a>` },
    { label: 'Cliente', render: (r) => esc(r.cliente_nombre) + `<br><span class="muted">${esc(r.zona)}</span>` },
    { label: 'Ref. / unid.', cls: 'num', render: (r) => `${r.referencias} / ${fNum(r.unidades)}` },
    { label: 'Prioridad', render: (r) => prioBadge(r.prioridad) },
    { label: 'Entrega est.', cls: 'nowrap', render: (r) => fD(r.fecha_estimada_entrega) + (r.retrasado ? ' <span class="badge b-retraso">Retrasado</span>' : '') },
    { label: 'Ruta', render: (r) => r.ruta_nombre ? esc(r.ruta_nombre) : '<span class="muted">Sin ruta</span>' },
    { label: 'Responsable', render: (r) => esc(r.responsable_nombre) || '<span class="muted">—</span>' },
    { label: '', cls: 'actions', render: acciones }
  ], items);
}

async function opSection(boxId, filtro, acciones, vacio) {
  const box = $('#' + boxId);
  try {
    const res = await api('pedidos.list', Object.assign({ pageSize: 100, sortBy: 'prioridad', sortDir: 'desc' }, filtro));
    if (!box.isConnected) return;
    box.innerHTML = res.items.length ? opTable(res.items, acciones) + (res.total > res.items.length ? `<p class="help">Se muestran ${res.items.length} de ${res.total}. Use el módulo Pedidos para ver el resto.</p>` : '') : emptyHTML(vacio, 'check-circle');
    box._items = res.items;
  } catch (e) { box.innerHTML = errorHTML(e); }
  icons();
}

function bindOps(container, handlers) {
  container.onclick = async (e) => {
    const o = e.target.closest('[data-open]');
    if (o) { e.preventDefault(); return openPedido(o.dataset.open); }
    const b = e.target.closest('[data-op]'); if (!b) return;
    const box = b.closest('[id]');
    const item = (box._items || []).find((x) => x.pedido_id === b.dataset.id);
    if (item && handlers[b.dataset.op]) handlers[b.dataset.op](item, b);
  };
}

VIEWS.preparacion = function () {
  $('#view').innerHTML = `
    <div class="card"><h3><i data-lucide="clock"></i>Pedidos pendientes por preparar</h3><div id="opPend">${loadingHTML()}</div></div>
    <div class="card"><h3><i data-lucide="clipboard-list"></i>En preparación</h3><div id="opPrep">${loadingHTML()}</div></div>`;
  const reload = () => VIEWS.preparacion();
  opSection('opPend', { estado: 'Pendiente' }, (r) => `<button class="btn sm warn" data-op="iniciar" data-id="${esc(r.pedido_id)}"><i data-lucide="play"></i>Iniciar</button>`, 'No hay pedidos pendientes.');
  opSection('opPrep', { estado: 'En preparación' }, (r) => r.preparado ? '<span class="badge b-ok">Lista para despacho</span>'
    : `<button class="btn sm" data-op="alistar" data-id="${esc(r.pedido_id)}"><i data-lucide="clipboard-check"></i>Alistar</button>`, 'No hay pedidos en preparación.');
  bindOps($('#view'), {
    iniciar: async (p, b) => { if (await iniciarPreparacion(p, b)) reload(); },
    alistar: (p) => openAlistamiento(p.pedido_id, reload)
  });
};

VIEWS.despacho = function () {
  $('#view').innerHTML = `
    <div class="card"><h3><i data-lucide="package-check"></i>Listos para despacho <span class="sub">(preparación completa)</span></h3><div id="opListos">${loadingHTML()}</div></div>
    <div class="card"><h3><i data-lucide="truck"></i>En distribución <span class="sub">(despachados, pendientes de entrega)</span></h3><div id="opDesp">${loadingHTML()}</div></div>
    ${can('excepciones.autorizar') ? `<div class="card"><h3><i data-lucide="alert-triangle"></i>En preparación sin finalizar <span class="sub">(solo despacho por excepción)</span></h3><div id="opExc">${loadingHTML()}</div></div>` : ''}`;
  const reload = () => VIEWS.despacho();
  const desp = (r) => `<button class="btn sm primary" data-op="despachar" data-id="${esc(r.pedido_id)}"><i data-lucide="truck"></i>Despachar</button>`;
  opSection('opListos', { estado: 'En preparación', preparado: 'SI' }, desp, 'No hay pedidos listos para despacho.');
  opSection('opDesp', { estado: 'Despachado' }, (r) => `<button class="btn sm success" data-op="entregar" data-id="${esc(r.pedido_id)}"><i data-lucide="package-check"></i>Entrega</button>`, 'No hay pedidos en distribución.');
  if (can('excepciones.autorizar')) opSection('opExc', { estado: 'En preparación', preparado: 'NO' }, desp, 'No hay pedidos en esta situación.');
  bindOps($('#view'), {
    despachar: (p) => openDespacho(p.pedido_id, reload),
    entregar: (p) => openEntrega(p, reload)
  });
};

/* ---------- Rutas ---------- */
VIEWS.rutas = async function () {
  if (can('rutas.gestionar')) {
    $('#topActions').innerHTML = '<button class="btn primary" id="btnRuta"><i data-lucide="plus"></i>Nueva ruta</button>';
    $('#btnRuta').onclick = () => openRutaForm();
  }
  $('#view').innerHTML = `<div class="notice info"><i data-lucide="info"></i><div>La asignación de pedidos a rutas es manual. El sistema no calcula recorridos ni optimiza rutas geográficamente.</div></div>
    <div class="toolbar"><div class="field"><label>Estado</label><select id="rtEstado">${options(S.cat.rutaEstados, S.rtEstado || '', { empty: 'Todos' })}</select></div></div><div id="rtTable">${loadingHTML()}</div>`;
  $('#rtEstado').onchange = (e) => { S.rtEstado = e.target.value; VIEWS.rutas(); icons(); };
  try {
    const rutas = await api('rutas.list', { estado: S.rtEstado || '' });
    if (S.view !== 'rutas') return;
    $('#rtTable').innerHTML = rutas.length ? tableHTML([
      { label: 'Código', render: (r) => `<b>${esc(r.codigo_ruta)}</b>${r.es_demo === 'SI' ? ' <span class="badge b-demo">DEMO</span>' : ''}` },
      { label: 'Nombre', render: (r) => esc(r.nombre_ruta) + `<br><span class="muted">${esc(r.zona)}</span>` },
      { label: 'Fecha', cls: 'nowrap', render: (r) => fD(r.fecha_operacion) },
      { label: 'Responsable', render: (r) => esc(r.responsable_nombre) || '—' },
      { label: 'Vehículo', render: (r) => esc(r.vehiculo) || '—' },
      { label: 'Pedidos', cls: 'num', render: (r) => `${r.conteos.total}${r.capacidad ? ' / ' + esc(r.capacidad) : ''}` },
      { label: 'Por despachar', cls: 'num', render: (r) => r.conteos['Pendiente'] + r.conteos['En preparación'] },
      { label: 'Entregados', cls: 'num', render: (r) => r.conteos['Entregado'] },
      { label: 'Estado', render: (r) => rutaEstadoBadge(r.estado) }
    ], rutas, { rowAttr: (r) => `class="clickable" data-id="${esc(r.ruta_id)}"` }) : emptyHTML('No hay rutas registradas.', 'map');
    $('#rtTable').onclick = (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) openRuta(tr.dataset.id); };
  } catch (e) { $('#rtTable').innerHTML = errorHTML(e); }
  icons();
};

function openRutaForm(r) {
  r = r || { fecha_operacion: todayBog() };
  const cerrada = r.ruta_id && ['finalizada', 'cancelada'].includes(r.estado);
  const dis = cerrada ? 'disabled' : '';
  const m = openModal({ title: r.ruta_id ? 'Editar ruta' : 'Nueva ruta', size: 'md', body: `
    ${cerrada ? '<div class="notice warn"><i data-lucide="lock"></i><div>Ruta cerrada: solo se pueden editar las observaciones.</div></div>' : ''}
    <form id="rf" class="form-grid" autocomplete="off">
      <div class="field"><label>Código <span class="req">*</span></label><input name="codigo_ruta" maxlength="30" value="${esc(r.codigo_ruta)}" ${dis}></div>
      <div class="field span-2"><label>Nombre <span class="req">*</span></label><input name="nombre_ruta" maxlength="100" value="${esc(r.nombre_ruta)}" ${dis}></div>
      <div class="field span-2"><label>Ciudad o zona atendida <span class="req">*</span></label><input name="zona" maxlength="120" value="${esc(r.zona)}" ${dis}></div>
      <div class="field"><label>Fecha de operación <span class="req">*</span></label><input type="date" name="fecha_operacion" value="${esc(r.fecha_operacion)}" ${dis}></div>
      <div class="field span-2"><label>Responsable de distribución</label><select name="responsable_id" ${dis}>${userOptions(r.responsable_id, 'Sin asignar')}</select></div>
      <div class="field"><label>Capacidad (pedidos)</label><input type="number" min="1" step="1" name="capacidad" value="${esc(r.capacidad)}" ${dis}></div>
      <div class="field span-3"><label>Vehículo / medio de transporte</label><input name="vehiculo" maxlength="60" value="${esc(r.vehiculo)}" ${dis}></div>
      <div class="field span-3"><label>Descripción</label><textarea name="descripcion" maxlength="500" ${dis}>${esc(r.descripcion)}</textarea></div>
      <div class="field span-3"><label>Observaciones</label><textarea name="observaciones" maxlength="1000">${esc(r.observaciones)}</textarea></div>
    </form>`, footer: '<button class="btn" data-close>Cancelar</button><button class="btn primary" id="rfOk"><i data-lucide="save"></i>Guardar</button>' });
  $('#rfOk', m.el).onclick = async (e) => {
    const f = $('#rf', m.el).elements;
    const data = { ruta_id: r.ruta_id || '' };
    ['codigo_ruta', 'nombre_ruta', 'zona', 'fecha_operacion', 'responsable_id', 'capacidad', 'vehiculo', 'descripcion', 'observaciones'].forEach((k) => { data[k] = f[k].value.trim(); });
    if (!cerrada && (!data.codigo_ruta || !data.nombre_ruta || !data.zona || !data.fecha_operacion)) return toast('Complete los campos obligatorios.', 'warn');
    if (data.capacidad && !(Number(data.capacidad) >= 1 && Number.isInteger(Number(data.capacidad)))) return toast('La capacidad debe ser un entero mayor que cero.', 'warn');
    const res = await run('rutas.save', data, e.currentTarget, 'Ruta guardada.');
    if (res) { m.close(); S.rutas = null; if (S.view === 'rutas') VIEWS.rutas(); if (r.ruta_id) openRuta(r.ruta_id); }
  };
}

async function openRuta(id) {
  const m = openModal({ title: 'Ruta', size: 'lg', body: loadingHTML() });
  let d;
  try { d = await api('rutas.get', { ruta_id: id }); } catch (e) { m.body.innerHTML = errorHTML(e); icons(); return; }
  if (!m.el.isConnected) return;
  const r = d.ruta, c = d.conteos;
  const abierta = ['planificada', 'activa'].includes(r.estado);
  m.el.querySelector('.modal-head h2').textContent = `Ruta ${r.codigo_ruta} · ${r.nombre_ruta}`;
  m.body.innerHTML = `
    <div style="margin-bottom:12px">${rutaEstadoBadge(r.estado)}</div>
    <div class="dl"><div><span>Zona</span><b>${esc(r.zona)}</b></div><div><span>Fecha de operación</span><b>${fD(r.fecha_operacion)}</b></div>
      <div><span>Responsable</span><b>${esc(r.responsable_nombre) || '—'}</b></div><div><span>Vehículo</span><b>${esc(r.vehiculo) || '—'}</b></div>
      <div><span>Capacidad</span><b>${esc(r.capacidad) || 'Sin límite'}</b></div><div><span>Pedidos</span><b>${c.total} (pend. ${c['Pendiente']}, prep. ${c['En preparación']}, desp. ${c['Despachado']}, entr. ${c['Entregado']})</b></div>
      ${r.descripcion ? `<div style="grid-column:1/-1"><span>Descripción</span><b>${esc(r.descripcion)}</b></div>` : ''}
      ${r.observaciones ? `<div style="grid-column:1/-1"><span>Observaciones</span><b>${esc(r.observaciones)}</b></div>` : ''}</div>
    <div class="form-section">Pedidos asociados</div>
    <div id="rtPeds">${d.pedidos.length ? tableHTML([
      { label: 'Número', render: (x) => `<a href="#" data-open="${esc(x.pedido_id)}"><b>${esc(x.numero_pedido)}</b></a>` },
      { label: 'Cliente', render: (x) => esc(x.cliente_nombre) + `<br><span class="muted">${esc(x.direccion_entrega)}, ${esc(x.zona)}</span>` },
      { label: 'Unid.', cls: 'num', render: (x) => fNum(x.unidades) },
      { label: 'Estado', render: (x) => estadoBadge(x.estado) + (x.preparado && x.estado === 'En preparación' ? ' <span class="badge b-ok">Lista</span>' : '') + (x.retrasado ? ' <span class="badge b-retraso">Retrasado</span>' : '') },
      { label: 'Entrega est.', render: (x) => fD(x.fecha_estimada_entrega) },
      { label: '', cls: 'actions', render: (x) => can('rutas.asignar') && ['Pendiente', 'En preparación'].includes(x.estado) ? `<button class="btn sm" data-ret="${esc(x.pedido_id)}"><i data-lucide="x"></i>Retirar</button>` : '' }
    ], d.pedidos) : emptyHTML('La ruta no tiene pedidos asignados.')}</div>
    ${d.pendientesDespacho.length ? `<p class="help">${d.pendientesDespacho.length} pedido(s) pendientes de despacho en esta ruta.</p>` : ''}`;
  const btns = [];
  if (can('rutas.gestionar')) btns.push('<button class="btn" data-a="edit"><i data-lucide="pencil"></i>Editar</button>');
  if (abierta && can('rutas.asignar')) btns.push('<button class="btn primary" data-a="asignar"><i data-lucide="plus"></i>Asignar pedidos</button>');
  if (r.estado === 'planificada' && can('rutas.asignar')) btns.push('<button class="btn" data-a="activa"><i data-lucide="play"></i>Activar</button>');
  if (r.estado === 'activa' && can('rutas.asignar')) btns.push('<button class="btn success" data-a="finalizada"><i data-lucide="flag"></i>Finalizar jornada</button>');
  if (abierta && can('rutas.gestionar')) btns.push('<button class="btn danger" data-a="cancelada"><i data-lucide="x-circle"></i>Cancelar ruta</button>');
  const foot = document.createElement('div'); foot.className = 'modal-foot'; foot.innerHTML = btns.join('') || '<button class="btn" data-close>Cerrar</button>';
  m.el.querySelector('.modal').appendChild(foot);
  const reload = () => { m.close(); S.rutas = null; if (S.view === 'rutas') VIEWS.rutas(); openRuta(id); };
  m.body.onclick = async (e) => {
    const o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); return openPedido(o.dataset.open); }
    const b = e.target.closest('[data-ret]'); if (!b) return;
    const x = d.pedidos.find((p) => p.pedido_id === b.dataset.ret);
    if (!await confirmDialog({ title: 'Retirar de la ruta', message: `El pedido <b>${esc(x.numero_pedido)}</b> quedará sin ruta asignada. Su estado no cambia.`, confirmText: 'Retirar' })) return;
    if (await run('rutas.retirar', { pedido_id: x.pedido_id, version: x.version }, b, 'Pedido retirado de la ruta.')) reload();
  };
  foot.onclick = async (e) => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'edit') { m.close(); return openRutaForm(r); }
    if (a === 'asignar') return openAsignar(r, reload);
    const msgs = {
      activa: 'La ruta pasará a <b>activa</b>.',
      finalizada: `Se finalizará la jornada. Los pedidos no despachados (${c['Pendiente'] + c['En preparación']}) se liberarán para reasignarlos; los despachados (${c['Despachado']}) conservan la ruta hasta registrar su entrega. <b>No se cambia el estado de ningún pedido.</b>`,
      cancelada: 'La ruta se cancelará y sus pedidos no despachados quedarán sin ruta. No es posible si hay pedidos en distribución.'
    };
    const res = await confirmDialog({ title: 'Cambiar estado de la ruta', message: msgs[a], danger: a === 'cancelada', confirmText: 'Confirmar',
      input: { label: a === 'cancelada' ? 'Motivo de la cancelación' : 'Observación (opcional)', required: a === 'cancelada', min: a === 'cancelada' ? 10 : 0 } });
    if (res === false) return;
    const out = await run('rutas.cambiarEstado', { ruta_id: r.ruta_id, estado: a, observacion: res }, b, 'Estado de la ruta actualizado.');
    if (out) { if (out.despachadosSinEntrega) toast(`${out.despachadosSinEntrega} pedido(s) siguen despachados sin entrega registrada.`, 'warn'); reload(); }
  };
  icons();
}

async function openAsignar(r, onDone) {
  const m = openModal({ title: `Asignar pedidos a ${r.codigo_ruta}`, size: 'lg', body: loadingHTML() });
  let res;
  try { res = await api('pedidos.list', { ruta_id: '__none', pageSize: 100, sortBy: 'prioridad', sortDir: 'desc' }); } catch (e) { m.body.innerHTML = errorHTML(e); icons(); return; }
  const items = res.items.filter((x) => ['Pendiente', 'En preparación'].includes(x.estado));
  m.body.innerHTML = `<div class="toolbar"><div class="field grow"><label>Filtrar por cliente, zona o número</label><input id="asQ"></div></div>
    <div id="asList">${items.length ? tableHTML([
      { label: '', render: (x) => `<input type="checkbox" value="${esc(x.pedido_id)}">` },
      { label: 'Número', render: (x) => `<b>${esc(x.numero_pedido)}</b>` },
      { label: 'Cliente', render: (x) => esc(x.cliente_nombre) },
      { label: 'Zona', render: (x) => esc(x.zona) + ', ' + esc(x.ciudad) },
      { label: 'Estado', render: (x) => estadoBadge(x.estado) },
      { label: 'Prioridad', render: (x) => prioBadge(x.prioridad) },
      { label: 'Entrega est.', render: (x) => fD(x.fecha_estimada_entrega) }
    ], items, { rowAttr: (x) => `data-s="${esc((x.numero_pedido + ' ' + x.cliente_nombre + ' ' + x.zona).toLowerCase())}"` }) : emptyHTML('No hay pedidos pendientes o en preparación sin ruta.')}</div>`;
  const foot = document.createElement('div'); foot.className = 'modal-foot';
  foot.innerHTML = `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="asOk"><i data-lucide="check"></i>Asignar seleccionados</button>`;
  m.el.querySelector('.modal').appendChild(foot);
  const q = $('#asQ', m.el);
  q.oninput = () => { const t = q.value.toLowerCase(); $$('tr[data-s]', m.el).forEach((tr) => { tr.style.display = tr.dataset.s.includes(t) ? '' : 'none'; }); };
  $('#asOk', m.el).onclick = async (e) => {
    const ids = $$('input[type=checkbox]:checked', m.el).map((x) => x.value);
    if (!ids.length) return toast('Seleccione al menos un pedido.', 'warn');
    const versiones = {}; items.forEach((x) => { if (ids.includes(x.pedido_id)) versiones[x.pedido_id] = x.version; });
    const out = await run('rutas.asignar', { ruta_id: r.ruta_id, pedido_ids: ids, versiones }, e.currentTarget, `${ids.length} pedido(s) asignado(s).`);
    if (out) { m.close(); onDone(); }
  };
  icons();
}
</script>

  <script>
'use strict';
/* =====================================================================
 * ViewsAdmin.html — Reportes, productos, usuarios, auditoría y configuración.
 * ===================================================================== */

const REPORTES = [
  ['registrados', 'Pedidos registrados por período'], ['estado', 'Pedidos por estado'], ['despachados', 'Pedidos despachados'],
  ['entregados', 'Pedidos entregados'], ['pendientes', 'Pedidos pendientes'], ['retrasados', 'Pedidos retrasados'],
  ['ruta', 'Pedidos por ruta'], ['responsable', 'Pedidos por responsable'], ['historial', 'Historial de operaciones'], ['rendimiento', 'Rendimiento de entregas']
];

VIEWS.reportes = async function () {
  const tipos = REPORTES.filter(([k]) => k !== 'historial' || can('historial.ver'));
  const hoy = todayBog();
  const hace30 = new Date(Date.now() - 29 * 86400000).toISOString().slice(0, 10);
  $('#view').innerHTML = `
    <div class="card"><form id="rpF" class="filters" autocomplete="off">
      <div class="field" style="grid-column:span 2"><label>Informe</label><select name="tipo">${options(tipos, 'registrados', { key: (x) => x[0], label: (x) => x[1] })}</select></div>
      <div class="field"><label>Desde</label><input type="date" name="desde" value="${hace30}"></div>
      <div class="field"><label>Hasta</label><input type="date" name="hasta" value="${hoy}"></div>
      <div class="field"><label>Estado</label><select name="estado">${options(S.cat.estados, '', { empty: 'Todos' })}</select></div>
      <div class="field"><label>Ruta</label><select name="ruta_id" id="rpRuta"><option value="">Todas</option></select></div>
      <div class="field"><label>Responsable</label><select name="responsable_id">${options([{ usuario_id: '__none', nombre: 'Sin responsable' }].concat(S.usuarios), '', { empty: 'Todos', key: (u) => u.usuario_id, label: (u) => u.nombre })}</select></div>
      <div class="field"><label>Prioridad</label><select name="prioridad">${options(S.cat.prioridades, '', { empty: 'Todas' })}</select></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1">
        <button class="btn primary" type="submit"><i data-lucide="eye"></i>Generar vista previa</button>
        <button class="btn" type="button" id="rpCsv"><i data-lucide="file-spreadsheet"></i>Exportar CSV</button>
        <button class="btn" type="button" id="rpPdf"><i data-lucide="file-text"></i>Exportar PDF</button></div>
    </form><p class="help" style="margin-bottom:0">Las fechas filtran por creación del pedido (despachados y entregados: por fecha real del evento). Los informes se calculan en el servidor con sus permisos; los pedidos anulados no se incluyen.</p></div>
    <div id="rpOut"></div>`;
  const params = () => {
    const fd = new FormData($('#rpF'));
    const p = Object.fromEntries(fd.entries());
    if (p.desde && p.hasta && p.desde > p.hasta) { toast('La fecha inicial no puede ser posterior a la final.', 'warn'); return null; }
    return p;
  };
  $('#rpF').onsubmit = async (e) => {
    e.preventDefault();
    const p = params(); if (!p) return;
    $('#rpOut').innerHTML = loadingHTML('Generando informe…');
    try {
      const r = await api('reportes.generar', p);
      const filas = r.filas.slice(0, 300);
      $('#rpOut').innerHTML = `<div class="card"><h3>${esc(r.titulo)}</h3>
        <p class="help">Período: ${esc(r.periodo)} · ${esc(r.filtros)} · Generado ${esc(r.generado)}</p>
        ${r.totales.map((t) => `<span class="badge" style="margin:0 6px 10px 0">${esc(t.label)}: ${esc(t.valor)}</span>`).join('')}
        ${r.filas.length ? `<div class="table-wrap"><table class="t"><thead><tr>${r.columnas.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>${filas.map((f) => `<tr>${f.map((v) => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : emptyHTML('No hay registros para los filtros seleccionados.')}
        ${r.filas.length > filas.length ? `<p class="help">Vista previa limitada a ${filas.length} de ${r.filas.length} filas. Las exportaciones incluyen todas.</p>` : ''}
        ${r.truncado ? '<p class="help">El informe superó el máximo de filas y fue recortado. Use filtros más específicos.</p>' : ''}</div>`;
    } catch (err) { $('#rpOut').innerHTML = errorHTML(err); }
    icons();
  };
  $('#rpCsv').onclick = async (e) => {
    const p = params(); if (!p) return;
    const r = await run('reportes.csv', p, e.currentTarget);
    if (r) { downloadBlob(new Blob([r.content], { type: 'text/csv;charset=utf-8' }), r.filename); toast(`CSV generado (${r.filas} filas).`, 'ok'); }
  };
  $('#rpPdf').onclick = async (e) => {
    const p = params(); if (!p) return;
    const r = await run('reportes.pdf', p, e.currentTarget);
    if (r) {
      const bin = atob(r.base64); const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      downloadBlob(new Blob([bytes], { type: 'application/pdf' }), r.filename); toast('PDF generado.', 'ok');
    }
  };
  icons();
  try {
    await loadRutas();
    $('#rpRuta').innerHTML = options([{ ruta_id: '__none', codigo_ruta: 'Sin ruta', nombre_ruta: '' }].concat(S.rutas), '',
      { empty: 'Todas', key: (r) => r.ruta_id, label: (r) => r.nombre_ruta ? `${r.codigo_ruta} · ${r.nombre_ruta}` : r.codigo_ruta });
  } catch (e) { /* filtro de ruta queda en "Todas" */ }
};

/* ---------- Productos ---------- */
VIEWS.productos = async function () {
  $('#topActions').innerHTML = '<button class="btn primary" id="btnProd"><i data-lucide="plus"></i>Nuevo producto</button>';
  $('#btnProd').onclick = () => openProductoForm();
  try {
    const list = await loadProductos(true);
    if (S.view !== 'productos') return;
    $('#view').innerHTML = `<div class="notice info"><i data-lucide="info"></i><div>Catálogo de referencia. Esta versión no controla existencias de inventario. Desactive un producto en lugar de borrarlo para conservar el historial.</div></div>` +
      (list.length ? tableHTML([
        { label: 'SKU', render: (p) => `<b>${esc(p.sku)}</b>` }, { label: 'Nombre', key: 'nombre' }, { label: 'Unidad', key: 'unidad_medida' },
        { label: 'Precio ref.', cls: 'num', render: (p) => p.precio_referencia !== '' ? fCOP(p.precio_referencia) : '—' },
        { label: 'Estado', render: (p) => p.activo === 'SI' ? '<span class="badge b-ok">Activo</span>' : '<span class="badge b-anulado">Inactivo</span>' },
        { label: 'Actualizado', render: (p) => fDT(p.fecha_actualizacion) }
      ], list, { rowAttr: (p) => `class="clickable" data-id="${esc(p.producto_id)}"` }) : emptyHTML('No hay productos registrados.', 'boxes'));
    $('#view').onclick = (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) openProductoForm(S.productos.find((p) => p.producto_id === tr.dataset.id)); };
  } catch (e) { $('#view').innerHTML = errorHTML(e); }
  icons();
};

function openProductoForm(p) {
  p = p || { activo: 'SI', unidad_medida: 'und' };
  const m = openModal({ title: p.producto_id ? 'Editar producto' : 'Nuevo producto', body: `<form id="prf" class="form-grid" autocomplete="off">
    <div class="field"><label>SKU <span class="req">*</span></label><input name="sku" maxlength="40" value="${esc(p.sku)}"></div>
    <div class="field span-2"><label>Nombre <span class="req">*</span></label><input name="nombre" maxlength="150" value="${esc(p.nombre)}"></div>
    <div class="field"><label>Unidad de medida <span class="req">*</span></label><input name="unidad_medida" maxlength="20" value="${esc(p.unidad_medida)}"></div>
    <div class="field span-2"><label>Precio de referencia (COP, opcional)</label><input type="number" min="0" step="1" name="precio_referencia" value="${esc(p.precio_referencia)}"></div>
    <div class="field span-3"><label>Descripción</label><textarea name="descripcion" maxlength="500">${esc(p.descripcion)}</textarea></div>
    <label class="check span-3"><input type="checkbox" name="activo" ${p.activo === 'SI' ? 'checked' : ''}> Producto activo</label></form>`,
    footer: '<button class="btn" data-close>Cancelar</button><button class="btn primary" id="prOk"><i data-lucide="save"></i>Guardar</button>' });
  $('#prOk', m.el).onclick = async (e) => {
    const f = $('#prf', m.el).elements;
    const data = { producto_id: p.producto_id || '', sku: f.sku.value.trim(), nombre: f.nombre.value.trim(), unidad_medida: f.unidad_medida.value.trim(),
      precio_referencia: f.precio_referencia.value, descripcion: f.descripcion.value.trim(), activo: f.activo.checked };
    if (!data.sku || !data.nombre || !data.unidad_medida) return toast('Complete SKU, nombre y unidad de medida.', 'warn');
    if (await run('productos.save', data, e.currentTarget, 'Producto guardado.')) { m.close(); S.productos = null; VIEWS.productos(); }
  };
}

/* ---------- Usuarios ---------- */
const ROL_DESC = {
  'Administrador': 'Acceso total: usuarios, configuración, rutas, reportes, excepciones y auditoría.',
  'Operador': 'Registra, consulta y edita pedidos.',
  'Responsable de bodega': 'Consulta pendientes y gestiona la preparación.',
  'Despachador': 'Asigna rutas, despacha y registra entregas.',
  'Consulta': 'Solo lectura (dashboard, pedidos, rutas y reportes).'
};

VIEWS.usuarios = async function () {
  $('#topActions').innerHTML = '<button class="btn primary" id="btnUsr"><i data-lucide="user-plus"></i>Nuevo usuario</button>';
  $('#btnUsr').onclick = () => openUsuarioForm();
  try {
    const list = await api('usuarios.list');
    if (S.view !== 'usuarios') return;
    S.usrList = list;
    $('#view').innerHTML = `<div class="notice info"><i data-lucide="shield"></i><div>El acceso se valida con la cuenta de Google del usuario (mismo dominio de la organización). No se almacenan contraseñas. Los permisos se verifican en el servidor en cada operación.</div></div>
      ${tableHTML([
        { label: 'Nombre', render: (u) => `<b>${esc(u.nombre)}</b>${u.es_demo === 'SI' ? ' <span class="badge b-demo">DEMO</span>' : ''}` },
        { label: 'Correo', key: 'correo' }, { label: 'Rol', render: (u) => `<span class="badge">${esc(u.rol)}</span>` },
        { label: 'Estado', render: (u) => u.activo === 'SI' ? '<span class="badge b-ok">Activo</span>' : '<span class="badge b-anulado">Inactivo</span>' },
        { label: 'Creado', render: (u) => fD(u.fecha_creacion) }
      ], list, { rowAttr: (u) => `class="clickable" data-id="${esc(u.usuario_id)}"` })}
      <div class="card section-gap"><h3><i data-lucide="key-round"></i>Perfiles y permisos</h3><ul class="help" style="margin:0">${Object.entries(ROL_DESC).map(([k, v]) => `<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join('')}</ul></div>`;
    $('#view').onclick = (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) openUsuarioForm(S.usrList.find((u) => u.usuario_id === tr.dataset.id)); };
  } catch (e) { $('#view').innerHTML = errorHTML(e); }
  icons();
};

function openUsuarioForm(u) {
  u = u || { activo: 'SI', rol: 'Consulta' };
  const m = openModal({ title: u.usuario_id ? 'Editar usuario' : 'Nuevo usuario', body: `<form id="uf" class="form-grid" autocomplete="off">
    <div class="field span-3"><label>Nombre <span class="req">*</span></label><input name="nombre" maxlength="120" value="${esc(u.nombre)}"></div>
    <div class="field span-3"><label>Correo de Google <span class="req">*</span></label><input type="email" name="correo" maxlength="120" value="${esc(u.correo)}"></div>
    <div class="field span-3"><label>Rol</label><select name="rol">${options(S.cat.roles, u.rol)}</select><span class="help" id="ufDesc">${esc(ROL_DESC[u.rol])}</span></div>
    <label class="check span-3"><input type="checkbox" name="activo" ${u.activo === 'SI' ? 'checked' : ''}> Usuario activo</label></form>`,
    footer: '<button class="btn" data-close>Cancelar</button><button class="btn primary" id="ufOk"><i data-lucide="save"></i>Guardar</button>' });
  const f = $('#uf', m.el).elements;
  f.rol.onchange = () => { $('#ufDesc', m.el).textContent = ROL_DESC[f.rol.value]; };
  $('#ufOk', m.el).onclick = async (e) => {
    const data = { usuario_id: u.usuario_id || '', nombre: f.nombre.value.trim(), correo: f.correo.value.trim(), rol: f.rol.value, activo: f.activo.checked };
    if (!data.nombre || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.correo)) return toast('Indique un nombre y un correo válido.', 'warn');
    if (u.activo === 'SI' && !data.activo && !await confirmDialog({ title: 'Desactivar usuario', danger: true, message: `${esc(data.nombre)} perderá el acceso a la aplicación de inmediato.`, confirmText: 'Desactivar' })) return;
    if (await run('usuarios.save', data, e.currentTarget, 'Usuario guardado.')) {
      m.close();
      try { const s = await api('session.get'); S.usuarios = s.catalogos.usuarios; } catch (err) { /* catálogo se refresca al recargar */ }
      VIEWS.usuarios();
    }
  };
}

/* ---------- Auditoría ---------- */
VIEWS.historial = function () {
  S.hq = S.hq || { page: 1, pageSize: 25 };
  $('#view').innerHTML = `<div class="card"><form id="hF" class="filters">
      <div class="field" style="grid-column:span 2"><label>Buscar (referencia, acción, usuario u observación)</label><input name="q" value="${esc(S.hq.q || '')}"></div>
      <div class="field"><label>Entidad</label><select name="entidad">${options(['Pedido', 'Ruta', 'Usuario', 'Producto', 'Configuracion'], S.hq.entidad, { empty: 'Todas' })}</select></div>
      <div class="field"><label>Desde</label><input type="date" name="desde" value="${esc(S.hq.desde || '')}"></div>
      <div class="field"><label>Hasta</label><input type="date" name="hasta" value="${esc(S.hq.hasta || '')}"></div>
      <div><button class="btn primary"><i data-lucide="search"></i>Buscar</button></div></form></div><div id="hOut">${loadingHTML()}</div>`;
  $('#hF').onsubmit = (e) => { e.preventDefault(); Object.assign(S.hq, Object.fromEntries(new FormData(e.target).entries()), { page: 1 }); loadHist(); };
  $('#hOut').onclick = (e) => { const b = e.target.closest('[data-page]'); if (b && !b.disabled) { S.hq.page = Number(b.dataset.page); loadHist(); } };
  loadHist();
};
async function loadHist() {
  try {
    const res = await api('historial.list', S.hq);
    $('#hOut').innerHTML = res.total ? tableHTML([
      { label: 'Fecha', cls: 'nowrap', render: (h) => fDT(h.fecha_evento) }, { label: 'Entidad', key: 'entidad' }, { label: 'Referencia', key: 'referencia' },
      { label: 'Acción', render: (h) => esc(ACCIONES[h.accion] || h.accion) }, { label: 'Anterior', key: 'valor_anterior' }, { label: 'Nuevo', key: 'valor_nuevo' },
      { label: 'Usuario', key: 'usuario' }, { label: 'Observación', key: 'observacion' }], res.items) + pagerHTML(res) : emptyHTML('No hay eventos para los filtros seleccionados.');
  } catch (e) { $('#hOut').innerHTML = errorHTML(e); }
  icons();
}

/* ---------- Configuración ---------- */
VIEWS.config = async function () {
  try {
    const rows = await api('config.get');
    if (S.view !== 'config') return;
    const editables = rows.filter((r) => r.editable);
    $('#view').innerHTML = `<div class="card"><form id="cfF" class="form-grid">
      ${editables.map((r) => `<div class="field"><label>${esc(r.descripcion || r.clave)}</label>
        ${['incluir_demo_en_reportes', 'modo_produccion'].includes(r.clave) ? `<select name="${esc(r.clave)}">${options(['SI', 'NO'], r.valor)}</select>`
          : `<input name="${esc(r.clave)}" value="${esc(r.valor)}" ${/horas|seg$/.test(r.clave) ? 'type="number" min="0" step="any"' : ''}>`}
        <span class="help">${esc(r.clave)}</span></div>`).join('')}
      </form><div style="margin-top:12px"><button class="btn primary" id="cfOk"><i data-lucide="save"></i>Guardar configuración</button></div></div>
      <div class="card"><h3>Parámetros del sistema (solo lectura)</h3>${rows.filter((r) => !r.editable).map((r) => `<p class="help"><b>${esc(r.clave)}</b>: ${esc(r.valor)} — ${esc(r.descripcion)}</p>`).join('')}</div>`;
    $('#cfOk').onclick = async (e) => {
      const data = Object.fromEntries(new FormData($('#cfF')).entries());
      const r = await run('config.save', data, e.currentTarget);
      if (r) {
        toast(r.cambios ? `Configuración guardada (${r.cambios} cambio(s)).` : 'No había cambios.', 'ok');
        if (data.nombre_empresa) { S.cfg.nombre_empresa = data.nombre_empresa; $('#brandName').textContent = data.nombre_empresa; }
        if (data.intervalo_actualizacion_seg) S.cfg.intervalo_actualizacion_seg = Number(data.intervalo_actualizacion_seg);
      }
    };
  } catch (e) { $('#view').innerHTML = errorHTML(e); }
  icons();
};
</script>

<script>
/* =====================================================================
 * demo-ui.js — Barra de la demo: cambio de rol, reinicio de datos y
 * exportación PDF mediante el diálogo de impresión del navegador.
 * ===================================================================== */
(function () {
  // En la demo el "PDF" es el HTML del informe: se abre el diálogo de impresión (Guardar como PDF).
  const originalDownload = window.downloadBlob;
  window.downloadBlob = async function (blob, filename) {
    if (!/\.pdf$/i.test(filename)) return originalDownload(blob, filename);
    const html = await blob.text();
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0';
    document.body.appendChild(iframe);
    const doc = iframe.contentWindow.document;
    doc.open(); doc.write(html.replace('<head>', '<head><title>' + filename.replace(/\.pdf$/i, '') + '</title>')); doc.close();
    setTimeout(() => { iframe.contentWindow.focus(); iframe.contentWindow.print(); setTimeout(() => iframe.remove(), 1500); }, 300);
  };

  function bar() {
    const usuarios = __demo.usuarios();
    const activo = __demo.activo();
    const el = document.createElement('div');
    el.className = 'demo-bar';
    el.innerHTML = `
      <span class="demo-tag">DEMO</span>
      <span class="demo-txt">Datos ficticios guardados solo en este navegador.</span>
      <label class="demo-txt" for="demoUser">Ver como:</label>
      <select id="demoUser">${usuarios.map((u) => `<option value="${esc(u.correo)}" ${u.correo === activo ? 'selected' : ''}>${esc(u.rol)} · ${esc(u.nombre.replace('[DEMO] ', ''))}</option>`).join('')}</select>
      <button type="button" id="demoReset" title="Borra los cambios y vuelve a los datos iniciales">Reiniciar datos</button>
      <button type="button" id="demoClose" aria-label="Ocultar barra de demo">×</button>`;
    document.body.appendChild(el);
    el.querySelector('#demoUser').onchange = (e) => __demo.cambiarUsuario(e.target.value);
    el.querySelector('#demoReset').onclick = () => { if (confirm('¿Reiniciar la demo? Se perderán los cambios que haya hecho.')) __demo.reiniciar(); };
    el.querySelector('#demoClose').onclick = () => el.remove();
  }
  document.addEventListener('DOMContentLoaded', bar);
})();

</script>
</body>
</html>
